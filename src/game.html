<title>Zakira Memory Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: phone-first app shell (max 560px), screens swap in place, fixed reserved banner slot at the bottom that disappears during matches */
:root{
  --bg:#0E1626; --bg2:#111B2E; --surface:#17223A; --surface2:#1F2E4D; --line:#2A3B5E;
  --fg:#F4F1E8; --muted:#98A4BB; --accent:#FFB547; --accent-ink:#2B1900; --accent-d:#C98410; --teal:#4FD1C5;
  --c-red:#FF5E5B; --c-blue:#4C8DFF; --c-green:#35D07F; --c-yellow:#FFD23F; --c-violet:#B47CFF;
  --wood:#CFA477; --wood2:#9C7148; --good:#35D07F; --bad:#FF5E5B; --card-face:#F4F1E8; --card-ink:#17223A;
  --f-display:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif;
  --f-body:'Tajawal','Segoe UI',system-ui,sans-serif;
  --ad-h:56px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.035) 1px,transparent 0);background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:14px 28px}
body.has-ad .app{padding-bottom:calc(var(--ad-h) + 28px)}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.wrap{flex-wrap:wrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.tnum{font-variant-numeric:tabular-nums}

/* buttons */
.btn{font-family:var(--f-display);font-weight:700;font-size:16px;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 3px 0 #0A1120;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0A1120}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{font-size:14px;padding:7px 12px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:42px;height:42px;border-radius:13px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-4px}
.logo{width:40px;height:40px;flex:none}
.screen-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.screen-head h2{flex:1}

/* panels */
.panel{background:var(--surface);border-radius:20px;padding:16px}
.player-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.avatar{width:54px;height:54px;border-radius:16px;background:var(--surface2);display:grid;place-items:center;font-size:30px;flex:none}
.avatar.sm{width:36px;height:36px;font-size:20px;border-radius:11px}
.avatar.lg{width:84px;height:84px;font-size:48px;border-radius:24px}
.lvl{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--accent)}
.xpbar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:5px;transition:width .6s}
.pts{text-align:center;font-family:var(--f-display)}
.pts b{display:block;font-size:24px;line-height:1;color:var(--accent)}
.pts span{font-size:12px;color:var(--muted)}

.play-hero{margin:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.play-hero .big{grid-column:1/-1;font-size:22px;padding:16px;border-radius:18px}
.tile{background:var(--surface);border:0;border-radius:18px;padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:0 3px 0 #0A1120}
.tile .ic{width:26px;height:26px}
.tile b{font-family:var(--f-display);font-size:16px}
.tile span{font-size:12px;color:var(--muted)}
.tile.t1 .ic{color:var(--teal)} .tile.t2 .ic{color:var(--c-violet)}

.daily{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));border-radius:18px;padding:14px;margin-bottom:18px;border:1.5px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.daily .ic{color:var(--accent);width:30px;height:30px}
.daily div{flex:1;min-width:0}
.daily b{font-family:var(--f-display);font-size:16px;display:block}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 10px}
.games-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:520px){.games-grid.wide{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{--tint:var(--teal);border:0;border-radius:18px;padding:10px 10px 12px;cursor:pointer;text-align:start;background:color-mix(in srgb,var(--tint) 16%,var(--surface));display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:0 3px 0 #0A1120;transition:transform .15s}
.gcard:hover{transform:translateY(-2px)}
.gcard .art{border-radius:12px;background:color-mix(in srgb,var(--tint) 22%,var(--bg2));aspect-ratio:3/2;display:grid;place-items:center;overflow:hidden}
.gcard .art svg{width:100%;height:100%}
.gcard b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.gcard span{font-size:12px;color:var(--muted);line-height:1.35}
.gcard.locked{cursor:default;opacity:.62}
.gcard.locked:hover{transform:none}
.lock-tag{position:absolute;top:16px;inset-inline-start:16px;background:rgba(14,22,38,.85);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;display:flex;gap:4px;align-items:center}
.lock-tag .ic{width:13px;height:13px}
.nav4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px}
.nav4 button{background:var(--surface);border:0;border-radius:16px;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.nav4 .ic{color:var(--accent)}

/* forms */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
input[type=text],select{font:inherit;font-weight:500;background:var(--bg2);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
.av-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.av-pick button{aspect-ratio:1;border-radius:14px;border:2px solid transparent;background:var(--surface2);font-size:26px;cursor:pointer}
.av-pick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface2))}
.seg{display:flex;background:var(--bg2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 6px;font-weight:700;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface2);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{border:2px solid var(--line);background:var(--bg2);border-radius:16px;padding:11px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mode b{font-family:var(--f-display);font-size:15px;display:flex;align-items:center;gap:6px}
.mode span{font-size:12px;color:var(--muted);line-height:1.35}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg2))}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{width:48px;height:28px;border-radius:14px;background:var(--surface2);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:all .2s}
.sw.on{background:color-mix(in srgb,var(--teal) 55%,var(--surface2))}
.sw.on::after{inset-inline-start:23px;background:#fff}
.rules{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
.setup-art{border-radius:18px;aspect-ratio:12/5;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--tint) 22%,var(--bg2))}
.setup-art svg{height:100%;width:auto;max-width:100%}

/* game */
.game{display:flex;flex-direction:column;gap:12px}
.gtop{display:flex;align-items:center;gap:10px}
.gtitle{flex:1;font-family:var(--f-display);font-size:19px;font-weight:700}
.gtimer{font-family:var(--f-display);font-variant-numeric:tabular-nums;background:var(--surface);border-radius:10px;padding:4px 10px;color:var(--muted)}
.pbar{display:flex;flex-wrap:wrap;gap:8px}
.pchip{--pcol:var(--accent);display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:999px;background:var(--surface);border:2px solid transparent;transition:all .25s;min-width:0}
[dir=rtl] .pchip{padding:5px 6px 5px 12px}
.pchip .pav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pcol) 30%,var(--surface2));font-size:16px}
.pchip .pnm{font-weight:700;font-size:13px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .psc{font-family:var(--f-display);color:var(--pcol);font-size:16px}
.pchip.on{border-color:var(--pcol);box-shadow:0 0 0 4px color-mix(in srgb,var(--pcol) 22%,transparent);transform:scale(1.04)}
.bot{font-style:normal;font-size:9px;background:var(--surface2);border-radius:5px;padding:0 4px;margin-inline-start:4px;color:var(--muted);vertical-align:middle}
.gstatus{min-height:48px;background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;display:flex;align-items:center;gap:10px;font-size:15px}
.gstatus .big{font-family:var(--f-display);font-size:22px;color:var(--accent)}
.gboard{position:relative}
.gfoot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.cdot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--pc);vertical-align:-2px;margin-inline:3px;box-shadow:0 0 0 2px rgba(255,255,255,.2)}

/* stones */
.stones{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;background:linear-gradient(160deg,#2B3E63,#1C2A47);border-radius:20px;padding:12px 10px 8px}
.pawn{border:0;background:transparent;padding:0;cursor:pointer;aspect-ratio:40/52;position:relative}
.pawn svg{width:100%;height:100%;overflow:visible;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pawn .pb{fill:var(--wood);transition:fill .25s}
.pawn .ps{fill:var(--wood2);transition:fill .25s}
.pawn .hl{fill:#fff;opacity:.32}
.pawn .sh{fill:#000;opacity:.3}
.pawn.show .pb{fill:var(--pc)}
.pawn.show .ps{fill:var(--pc);filter:brightness(.65)}
.pawn.up svg{transform:translateY(-12px) scale(1.1)}
.pawn.miss svg{animation:shake .4s}
.pawn.won svg{filter:drop-shadow(0 0 8px var(--pc))}
.pawn.gone{opacity:.1;pointer-events:none;transition:opacity .4s}
.die{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:8px 16px}
.die-face{width:52px;height:52px;border-radius:14px;background:var(--pc,var(--surface2));box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),inset 0 3px 0 rgba(255,255,255,.25);display:grid;place-items:center}
.die-face::after{content:"";width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.75)}
.die.rolling .die-face{animation:roll .25s linear infinite}
.die-lbl{font-family:var(--f-display);font-size:20px;font-weight:700;min-width:70px}
@keyframes roll{0%{transform:rotate(0) scale(.95)}50%{transform:rotate(180deg) scale(1.05)}100%{transform:rotate(360deg) scale(.95)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* numbers */
.nums{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px}
.ncell{aspect-ratio:1;border:0;border-radius:16px;background:var(--surface2);cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6vw,32px);color:transparent;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25);transition:background .2s,color .2s,transform .15s}
.ncell.show{color:var(--fg);background:color-mix(in srgb,var(--teal) 25%,var(--surface2))}
.ncell.open{color:#0E1626;background:var(--teal);transform:scale(.96)}
.ncell.wrong{color:#fff;background:var(--bad);animation:shake .4s}

/* pairs */
.pairs{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px;perspective:800px}
.pairs[data-n="24"]{--cols:4} .pairs[data-n="40"]{--cols:5} .pairs[data-n="16"]{--cols:4}
@media(min-width:520px){.pairs[data-n="24"]{--cols:6}.pairs[data-n="40"]{--cols:8}}
.card{aspect-ratio:3/4;border:0;padding:0;background:transparent;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .35s}
.card .fc,.card .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:grid;place-items:center}
.card .bk{background:var(--surface2);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.card .bk::after{content:"";width:30%;aspect-ratio:1;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.card .fc{background:var(--card-face);transform:rotateY(180deg);font-size:clamp(18px,6.5vw,34px)}
.pairs[data-n="40"] .card .fc{font-size:clamp(16px,5vw,28px)}
.card.flip{transform:rotateY(180deg)}
.card.matched .fc{box-shadow:inset 0 0 0 3px var(--owner)}
.card.matched{opacity:.8}

/* drawing */
.dgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px}
.dcell{aspect-ratio:1;border-radius:12px;background:var(--surface);border:1.5px dashed var(--line);display:grid;place-items:center;padding:4px;cursor:default;position:relative}
.dcell.tap{cursor:pointer}
.dcell.tap:hover{border-color:var(--accent)}
.dcell svg{width:100%;height:100%}
.shape path,.ink polyline{fill:none;stroke:var(--fg);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ink polyline{stroke:var(--teal);stroke-width:5}
.dcell .lbl{position:absolute;bottom:2px;inset-inline-end:3px;width:34%;opacity:.85}
.dcell .lbl path{stroke:var(--accent);stroke-width:9}
.dcell.ok{border:2px solid var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.dcell.near{border:2px solid var(--c-yellow);background:color-mix(in srgb,var(--c-yellow) 12%,var(--surface))}
.dcell.miss{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.dcell.extra{border:2px solid var(--muted)}
.pad-wrap{display:flex;flex-direction:column;gap:12px}
.pad{width:100%;max-width:320px;aspect-ratio:1;margin:0 auto;background:#F4F1E8;border-radius:16px;touch-action:none;display:block;cursor:crosshair}
.shape-chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.shape-chips button{aspect-ratio:1;border-radius:11px;border:2px solid transparent;background:var(--surface2);cursor:pointer;padding:5px}
.shape-chips button.on{border-color:var(--accent)}
.shape-chips svg{width:100%;height:100%}
.shape-chips path{fill:none;stroke:var(--fg);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-inline-end:4px}

/* sequence */
.seq4{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;margin:0 auto;width:100%}
.locgrid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px;max-width:360px;margin:0 auto;width:100%}
.spad{aspect-ratio:1;border:0;border-radius:22px;cursor:pointer;background:var(--pc,var(--surface2));opacity:.42;transition:opacity .12s,transform .12s,box-shadow .12s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.locgrid .spad{border-radius:14px;opacity:1;background:var(--surface2)}
.spad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 28px var(--pc,var(--accent))}
.locgrid .spad.lit{background:var(--accent)}
.spad.bad{background:var(--bad)!important;opacity:1}
.overlay-card{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,22,38,.82);border-radius:20px;z-index:2;text-align:center;padding:16px}

/* results */
.res-hero{text-align:center;padding:18px 0 6px}
.res-hero h1{font-size:36px;color:var(--accent)}
.rank-list{display:flex;flex-direction:column;gap:8px}
.rank-row{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 12px}
.rank-row.me{outline:2px solid var(--accent)}
.rank-n{font-family:var(--f-display);font-size:20px;text-align:center;color:var(--muted)}
.rank-row:first-child .rank-n{color:var(--accent)}
.reward{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reward div{background:var(--surface);border-radius:16px;padding:12px;text-align:center}
.reward b{font-family:var(--f-display);font-size:28px;display:block;color:var(--accent);line-height:1.1}
.reward div:nth-child(2) b{color:var(--teal)}
.note{font-size:13px;color:var(--muted);background:var(--bg2);border-radius:12px;padding:9px 12px;border:1px solid var(--line)}
.ach-chip{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border-radius:14px;padding:10px 12px}
.ach-chip .medal{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-inline-end:4px}
.dot.on{background:var(--good)}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin:6px 0 14px}
.pod{background:var(--surface);border-radius:16px 16px 10px 10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .place{font-family:var(--f-display);font-size:26px;line-height:1}
.pod.p1{padding-top:22px;background:color-mix(in srgb,var(--accent) 20%,var(--surface))} .pod.p1 .place{color:var(--accent)}
.pod.p2 .place{color:#C9D3E3} .pod.p3 .place{color:#E0A070}
.tbl-wrap{overflow-x:auto;border-radius:16px;background:var(--surface)}
table.lb{width:100%;border-collapse:collapse;font-size:13px;min-width:500px}
table.lb th{color:var(--muted);font-weight:700;text-align:start;padding:10px 8px;border-bottom:1px solid var(--line);font-size:12px}
table.lb td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.lb tr.me td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
table.lb tr:last-child td{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--bg2);border-radius:14px;padding:10px 4px;text-align:center}
.stats b{font-family:var(--f-display);font-size:20px;display:block;line-height:1.1}
.stats span{font-size:11px;color:var(--muted)}
.ach-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach{display:flex;gap:10px;align-items:center;background:var(--bg2);border-radius:14px;padding:10px;min-width:0}
.ach .medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none;font-family:var(--f-display);font-weight:800}
.ach.on .medal{background:var(--accent);color:var(--accent-ink)}
.ach b{font-size:13px;display:block}
.ach span{font-size:11px;color:var(--muted);line-height:1.3;display:block}
.ach:not(.on){opacity:.6}

.room-code{font-family:var(--f-display);font-size:38px;letter-spacing:.18em;color:var(--accent);text-align:center;line-height:1}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{background:var(--bg2);border-radius:16px;padding:10px;display:flex;align-items:center;gap:8px;min-width:0;position:relative}
.slot.empty{border:1.5px dashed var(--line);justify-content:center;color:var(--muted);min-height:60px}
.slot .grow{flex:1;min-width:0}
.slot .grow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:11px;font-weight:700}
.st.ready{color:var(--good)} .st.wait{color:var(--c-yellow)} .st.host{color:var(--accent)}
.kick{position:absolute;top:4px;inset-inline-end:4px;width:24px;height:24px;border-radius:8px;border:0;background:var(--surface2);cursor:pointer;display:grid;place-items:center}
.kick .ic{width:14px;height:14px}
.radar{width:170px;height:170px;margin:20px auto;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--teal) 20%,transparent),transparent 70%)}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--teal);animation:ping 2s infinite;opacity:0}
.radar::after{animation-delay:1s}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.1);opacity:0}}
.found{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:70px}
.found .avatar{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.copyline{display:flex;gap:8px;align-items:center;background:var(--bg2);border-radius:12px;padding:6px 6px 6px 12px;min-width:0}
[dir=rtl] .copyline{padding:6px 12px 6px 6px}
.copyline code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--muted);direction:ltr;text-align:start}

.modal-back{position:fixed;inset:0;background:rgba(5,9,18,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));animation:fade .2s}
@media(min-width:600px){.modal-back{align-items:center}}
.modal{background:var(--surface);border-radius:22px;padding:18px;width:100%;max-width:440px;max-height:calc(100% - 20px);overflow:auto;animation:up .25s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--ad-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:30;animation:up .25s;max-width:calc(100% - 32px);text-align:center}

.ad-inner b{font-size:10px;border:1px solid var(--muted);border-radius:4px;padding:0 4px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
.burst{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:15;background:var(--pc)}
.onb-hero{text-align:center;padding:20px 0 6px}
.onb-hero .logo{width:76px;height:76px}
.onb-hero h1{font-size:40px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ========= NET: live rooms ==========
   Every device in a match runs the same game engine with the same seed.
   The only thing sent is each player's own list of picks (in their presence),
   so all screens stay identical. Host starts games; nobody else has authority. */
const NET={api:null,ok:false,pid:null,nr:null,code:null,isHost:false,peers:[],lobbyPeers:[],
  cache:{},used:{},res:{},gone:{},waiters:[],myActs:[],game:null,lastGid:null,pending:null,autoStart:null,lobbyCfg:null,joinedAt:0,
  readyP:null};
NET.pid=store.get('pid',null);if(!NET.pid){NET.pid=Math.random().toString(36).slice(2,12);store.set('pid',NET.pid)}
const me0=()=>({pid:NET.pid,nm:profile?profile.name:'',av:profile?profile.avatar:'🙂',cc:profile?profile.country:''});
NET.readyP=new Promise(res=>{
  const u=window.claude&&window.claude.use;if(!u){res(false);return}
  window.claude.use('room').then(r=>{if(!r){res(false);return}
    NET.api=r;NET.ok=true;
    r.onConnection(()=>{},()=>{NET.ok=false});
    r.onPeers(ch=>{NET.lobbyPeers=ch.peers;NET.onLobby&&NET.onLobby(ch);const el=$('#online-n');if(el)el.textContent=t('onlineNow',ch.peers.length)},()=>{NET.ok=false});
    r.presence(me0()).catch(()=>{});
    res(true)}).catch(()=>res(false));
  setTimeout(()=>res(NET.ok),11000)});
const P=pr=>pr&&pr.presence||{};
NET.players=()=>{const seen={};return NET.peers.filter(p=>{const x=P(p);if(!x.pid||seen[x.pid])return false;seen[x.pid]=1;return true}).map(p=>P(p)).sort((a,b)=>(a.t||0)-(b.t||0)||String(a.pid).localeCompare(b.pid))};
NET.host=()=>NET.players().find(x=>x.host);
NET.join=async function(code,asHost,cfg,autoReady){
  if(!NET.ok)return false;code=code.toUpperCase();
  if(NET.nr&&NET.code===code)return true;if(NET.nr)await NET.leave();
  let nr;try{nr=await NET.api.join('zk-'+code.toLowerCase())}catch(e){toast(t('noLiveT'));return false}
  NET.nr=nr;NET.code=code;NET.isHost=!!asHost;NET.joinedAt=Date.now();NET.lobbyCfg=cfg||null;NET.lastGid=null;NET.game=null;NET.pending=null;
  await nr.presence({...me0(),t:Date.now(),host:!!asHost,rdy:!!(asHost||autoReady),lobby:asHost?cfg:null,game:null,acts:null,res:null,kick:null}).catch(()=>{});
  nr.onPeers(ch=>NET.onPeers(ch),()=>{});
  setTimeout(()=>{if(NET.nr!==nr)return;const list=NET.players();const i=list.findIndex(x=>x.pid===NET.pid);if(i>=4){toast(t('roomFullT'));NET.leave();if(current==='lobby')go('home')}},2500);
  return true};
NET.leave=async function(){const nr=NET.nr;NET.nr=null;NET.code=null;NET.isHost=false;NET.peers=[];NET.game=null;NET.autoStart=null;NET.waiters.forEach(w=>w.res('OUT'));NET.waiters=[];if(nr){try{await nr.leave()}catch(e){}}};
NET.set=patch=>{if(NET.nr)NET.nr.presence(patch).catch(()=>{})};
NET.onPeers=function(ch){
  NET.peers=ch.peers;const list=NET.players();const now=Date.now();
  const g=NET.game;
  list.forEach(x=>{if(g&&x.acts&&x.acts.gid===g.gid&&Array.isArray(x.acts.a)&&x.acts.a.length>(NET.cache[x.pid]||[]).length)NET.cache[x.pid]=x.acts.a.slice();
    if(g&&x.res&&x.res.gid===g.gid)NET.res[x.pid]=x.res});
  if(g)g.order.forEach(o=>{if(o.pid===NET.pid)return;if(list.some(x=>x.pid===o.pid))delete NET.gone[o.pid];else if(!NET.gone[o.pid])NET.gone[o.pid]=now});
  NET.pump();
  let host=list.find(x=>x.host);
  if(!host&&list.length&&list[0].pid===NET.pid&&now-NET.joinedAt>3000){NET.isHost=true;NET.set({host:true,rdy:true,lobby:NET.lobbyCfg||{game:'stones',diffIdx:1,opts:{}}});toast(t('nowHost'));host=null}
  if(host&&host.pid!==NET.pid){
    NET.lobbyCfg=host.lobby||NET.lobbyCfg;
    if(Array.isArray(host.kick)&&host.kick.includes(NET.pid)){toast(t('kicked'));NET.leave();if(current!=='game')go('home');return}
    const hg=host.game;
    if(hg&&hg.gid!==NET.lastGid&&Array.isArray(hg.order)&&hg.order.some(o=>o.pid===NET.pid)){
      if(current==='game')NET.pending=hg;else{NET.lastGid=hg.gid;NET.startLocal(hg)}}}
  if(NET.isHost&&NET.autoStart){const need=NET.autoStart;if(need.every(pid=>list.some(x=>x.pid===pid))){NET.autoStart=null;setTimeout(()=>NET.hostStart(),600)}}
  if(current==='lobby'&&!NET._raf){NET._raf=requestAnimationFrame(()=>{NET._raf=0;if(current==='lobby'&&!params.demo)SCREENS.lobby({})})}
};
NET.hostStart=function(cfg){
  cfg=cfg||NET.lobbyCfg;if(!cfg)return;
  const order=shuffle(NET.players().slice(0,4).map(x=>({pid:x.pid,nm:String(x.nm||'').slice(0,16),av:x.av||'🙂'})));
  const extra=cfg.opts&&cfg.opts.extraTurn!=null?cfg.opts.extraTurn:settings.extraTurn;
  const g={gid:Date.now().toString(36)+Math.floor(Math.random()*1e4),seed:Math.floor(Math.random()*2**31),cfg:{game:cfg.game,diffIdx:cfg.diffIdx,opts:{...(cfg.opts||{}),extraTurn:extra}},order};
  NET.lastGid=g.gid;NET.set({game:g,lobby:cfg});NET.startLocal(g)};
NET.startLocal=function(g){
  NET.game=g;NET.cache={};NET.used={};NET.res={};NET.gone={};NET.myActs=[];NET.pending=null;
  NET.set({acts:{gid:g.gid,a:[]},res:null});
  startMatch({game:g.cfg.game,diffIdx:g.cfg.diffIdx,mode:'room',opts:g.cfg.opts,net:g})};
NET.act=function(i){if(!NET.game)return;NET.myActs.push(i);NET.set({acts:{gid:NET.game.gid,a:NET.myActs.slice()}})};
NET.setRes=function(score,txt){if(NET.game)NET.set({res:{gid:NET.game.gid,score,txt}})};
NET.pump=function(){const now=Date.now();NET.waiters=NET.waiters.filter(w=>{
  if(w.kind==='act'){const arr=NET.cache[w.pid]||[],u=NET.used[w.pid]||0;if(arr.length>u){NET.used[w.pid]=u+1;w.res(arr[u]);return false}}
  else{const r=NET.res[w.pid];if(r){w.res(r);return false}}
  if(NET.gone[w.pid]&&now-NET.gone[w.pid]>20000){w.res('OUT');return false}
  if(!NET.nr){w.res('OUT');return false}
  return true});
  if(NET.waiters.length&&!NET._iv)NET._iv=setInterval(()=>{NET.pump();if(!NET.waiters.length){clearInterval(NET._iv);NET._iv=0}},1000)};
const nextAct=p=>new Promise(res=>{NET.waiters.push({kind:'act',pid:p.pid,res});NET.pump()});
const waitRes=p=>new Promise(res=>{NET.waiters.push({kind:'res',pid:p.pid,res});NET.pump()});

/* ========= MATCH CORE ========= */
let M=null;
function startMatch(cfg){
  const g=GAME(cfg.game),d=g.diffs[cfg.diffIdx];

  if(cfg.mode==='online'||cfg.mode==='friends')(cfg.others||[]).forEach((o,i)=>players.push({id:'b'+i,name:o.name,avatar:o.avatar,col:PCOL[i+1],isBot:true,skill:o.skill||.65,score:0}));
  if(cfg.net){players=cfg.net.order.map((o,i)=>({id:o.pid,pid:o.pid,name:o.nm||'?',avatar:o.av||'🙂',col:PCOL[i%4],isMe:o.pid===NET.pid,remote:o.pid!==NET.pid,score:0}));G=mulberry(cfg.net.seed)}
  else G=Math.random;
  M={id:Math.random(),alive:true,cfg,g,diff:d,mode:cfg.mode,players,net:!!cfg.net,cur:cfg.net?0:players.length>1?Math.floor(rnd()*players.length):0,solo:players.length===1,daily:!!cfg.daily,t0:Date.now()};
  current='game';document.body.classList.remove('has-ad');$('#ad').hidden=true;window.scrollTo(0,0);
  g.run();
}
const alive=id=>M&&M.id===id&&M.alive;
function gameShell(){
  app.innerHTML=`<section class="game"><header class="gtop"><button class="icon-btn" id="gquit" aria-label="${t('quit')}">${ic('x')}</button><div class="gtitle">${t('g_'+M.g.id)} <span class="small muted">· ${dlabel(M.diff)}</span></div><div class="gtimer" id="gtimer">00:00</div></header>
  <div class="pbar" id="pbar"></div><div class="gstatus" id="gstatus" aria-live="polite"></div><div class="gboard" id="gboard"></div><div class="gfoot" id="gfoot"></div></section>`;
  $('#gquit').onclick=async()=>{if(await confirmBox(t('quitQ'),t('quit'))){M.alive=false;clearInterval(M.tid);if(M.net)NET.leave();go('home')}};
  const id=M.id;clearInterval(M.tid);M.tid=setInterval(()=>{if(!alive(id)){clearInterval(M.tid);return}const s=Math.floor((Date.now()-M.t0)/1000),el=$('#gtimer');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
}
function renderPlayers(){const pb=$('#pbar');if(!pb)return;pb.innerHTML=M.players.map((p,i)=>`<div class="pchip ${(!M.solo&&i===M.cur&&M.showTurn!==false)?'on':''}" style="--pcol:${p.col};${p.out?'opacity:.4':''}"><span class="pav">${esc(p.avatar)}</span><span class="pnm">${esc(p.name)}${p.isBot?'<i class="bot">BOT</i>':''}${M.net&&p.isMe?`<i class="bot">${t('youTag')}</i>`:''}</span><b class="psc tnum">${p.scoreText!=null?p.scoreText:p.score}</b></div>`).join('')}
const status=h=>{const s=$('#gstatus');if(s)s.innerHTML=h};
const curP=()=>M.players[M.cur];
const canAct=()=>{const p=curP();return !p.isBot&&!p.remote};
const netAct=i=>{if(M.net)NET.act(i)};
const alone=()=>M.net&&M.players.filter(p=>!p.out).length<2;
function markOut(p){if(p.out)return;p.out=true;toast(t('playerOut',p.name));renderPlayers()}
const outVal=(p,v)=>p.out?v-100000:v;
function nextTurn(){const n=M.players.length;let k=0;do{M.cur=(M.cur+1)%n;k++}while(M.players[M.cur].out&&k<=n);renderPlayers();sfx('turn')}
const turnTxt=(p,txtKey,...a)=>p.isMe&&M.players.filter(x=>!x.isBot).length===1?t(txtKey,...a):'';
async function countdown(id,secs,key){for(let s=secs;s>0;s--){if(!alive(id))return false;status(t(key,s));if(s<=3)sfx('tick');await sleep(1000)}return alive(id)}

/* ---------- Game 1: stones ---------- */
async function gStones(){
  const id=M.id,d=M.diff;
  const colors=gshuffle(STONE_COLORS.flatMap(c=>Array(6).fill(c)));
  const taken=Array(30).fill(false);let attempts=0,busy=true,target=null,ended=false;
  M.players.forEach(p=>{p.score=0;if(p.isBot)p.mem={}});
  if(M.solo)M.players[0].scoreText='0/30';
  gameShell();const board=$('#gboard');board.className='gboard stones';
  board.innerHTML=colors.map((c,i)=>`<button class="pawn show" data-i="${i}" style="--pc:var(--c-${c})" aria-label="${t('stone')} ${i+1}">${PAWN}</button>`).join('');
  $('#gfoot').innerHTML=`<div class="die" id="die"><span class="die-face"></span><span class="die-lbl">?</span></div>`;
  renderPlayers();
  if(!await countdown(id,d.preview,'memorize'))return;
  $$('.pawn',board).forEach(b=>b.classList.remove('show'));sfx('flip');
  M.players.forEach(p=>{if(p.isBot)colors.forEach((c,i)=>{if(rnd()<p.skill*.4)p.mem[i]=c})});
  const cname=c=>`<span class="cdot" style="--pc:var(--c-${c})"></span>${t('c_'+c)}`;
  board.onclick=e=>{const b=e.target.closest('.pawn');if(!b||busy||!canAct())return;const i=+b.dataset.i;if(taken[i]||ended)return;netAct(i);doPick(i)};
  const setDie=c=>{const die=$('#die');die.style.setProperty('--pc',`var(--c-${c})`);$('.die-lbl',die).textContent=t('c_'+c)};
  async function roll(){
    const left=[...new Set(colors.filter((c,i)=>!taken[i]))];target=gpick(left);
    const die=$('#die');die.classList.add('rolling');sfx('roll');
    for(let k=0;k<8;k++){setDie(STONE_COLORS[k%5]);await sleep(85)}
    if(!alive(id))return;die.classList.remove('rolling');setDie(target);
    const p=curP();status(M.solo?t('findColor',cname(target)):t('turnFind',esc(p.name),cname(target)));
    if(p.isBot){await sleep(900+rnd()*800);if(!alive(id))return;doPick(botChoose(p))}
    else if(p.remote){busy=true;remotePick()}
    else busy=false;
  }
  async function remotePick(){const p=curP();const i=await nextAct(p);if(!alive(id)||ended)return;
    if(i==='OUT'){markOut(p);if(alone()){ended=true;return finishStones()}nextTurn();await sleep(300);return roll()}
    if(typeof i!=='number'||i<0||i>=30||taken[i])return remotePick();
    doPick(i)}
  function botChoose(p){const free=colors.map((c,i)=>i).filter(i=>!taken[i]);
    const known=free.filter(i=>p.mem[i]===target);if(known.length&&rnd()<p.skill+.1)return pick(known);
    const unk=free.filter(i=>!(i in p.mem));return pick(unk.length?unk:free)}
  async function doPick(i){
    if(taken[i]||ended)return;busy=true;attempts++;
    const b=board.children[i];b.classList.add('up','show');sfx('flip');
    M.players.forEach(p=>{if(p.isBot&&rnd()<p.skill)p.mem[i]=colors[i]});
    await sleep(850);if(!alive(id))return;
    const p=curP();
    if(colors[i]===target){taken[i]=true;p.score++;sfx('good');b.classList.add('won');burst(b,`var(--c-${target})`);if(M.solo)p.scoreText=`${p.score}/30`;renderPlayers();await sleep(450);b.classList.add('gone');b.disabled=true}
    else{sfx('bad');b.classList.add('miss');await sleep(500);b.classList.remove('up','show','miss')}
    if(!alive(id))return;
    if(taken.every(Boolean)){ended=true;return finishStones()}
    if(!M.solo)nextTurn();
    await sleep(300);roll();
  }
  function finishStones(){
    if(M.solo){const perf=clamp(30/attempts,0,1);finish({perf,metric:Math.round(perf*100),line:`${attempts} ${t('attempts')} · ${Math.round(perf*100)}%`})}
    else finish({order:M.players.map(p=>({p,val:outVal(p,p.score),txt:p.score}))});
  }
  roll();
}

/* ---------- Game 2: numbers ---------- */
async function gNumbers(){
  const id=M.id,n=M.diff.n,cols={9:3,12:4,16:4,20:5,25:5}[n];
  const vals=gshuffle([...Array(n)].map((_,i)=>i+1));
  let progress=0,busy=true,mistakes=0,ended=false;
  M.players.forEach(p=>{p.score=0;if(p.isBot)p.mem={}});
  if(M.solo)M.players[0].scoreText='0/'+n;
  gameShell();const board=$('#gboard');board.className='gboard nums';board.style.setProperty('--cols',cols);
  board.innerHTML=vals.map((v,i)=>`<button class="ncell show" data-i="${i}" aria-label="${i+1}"><span>${v}</span></button>`).join('');
  renderPlayers();
  if(!await countdown(id,Math.round(n*.6)+3,'memorize'))return;
  $$('.ncell',board).forEach(c=>c.classList.remove('show'));sfx('flip');
  const pmem=p=>clamp(p.skill*Math.pow(9/n,.45)*.95,0,1);
  M.players.forEach(p=>{if(p.isBot)vals.forEach((v,i)=>{if(rnd()<pmem(p))p.mem[v]=i})});
  board.onclick=e=>{const b=e.target.closest('.ncell');if(!b||busy||ended||!canAct())return;const i=+b.dataset.i;if(b.classList.contains('open'))return;netAct(i);tap(i)};
  function turnStart(){progress=0;const p=curP();status(M.solo?t('openNext',1):t('turnOpen',esc(p.name),1));busy=false;if(p.isBot){busy=true;setTimeout(botStep,900)}else if(p.remote){busy=true;remoteStep()}}
  async function remoteStep(){const p=curP();const i=await nextAct(p);if(!alive(id)||ended)return;
    if(i==='OUT'){markOut(p);$$('.ncell',board).forEach(x=>x.classList.remove('show','open','wrong'));if(alone()){ended=true;return finishNums(null)}nextTurn();return turnStart()}
    if(typeof i!=='number'||i<0||i>=n||board.children[i].classList.contains('open'))return remoteStep();
    tap(i,'remote')}
  async function botStep(){if(!alive(id)||ended)return;const p=curP();if(!p.isBot)return;
    const next=progress+1,opened=i=>board.children[i].classList.contains('open');let idx=p.mem[next];
    if(idx==null||opened(idx)||rnd()>p.skill+.12){const pool=vals.map((v,i)=>i).filter(i=>!opened(i));const unk=pool.filter(i=>!Object.values(p.mem).includes(i));idx=pick(unk.length&&rnd()<.7?unk:pool)}
    await tap(idx,true)}
  async function tap(i,src){const fromBot=src===true;
    const c=board.children[i];if(c.classList.contains('open')||ended)return;
    const v=vals[i],p=curP();
    M.players.forEach(b=>{if(b.isBot&&rnd()<b.skill)b.mem[v]=i});
    if(v===progress+1){progress++;c.classList.add('open','show');sfx('pad',progress);p.score=Math.max(p.score,progress);if(M.solo)p.scoreText=`${progress}/${n}`;renderPlayers();
      if(progress===n){ended=true;sfx('good');await sleep(500);return finishNums(p)}
      status(M.solo?t('openNext',progress+1):t('turnOpen',esc(p.name),progress+1));
      if(fromBot)setTimeout(botStep,520+rnd()*420);else if(src==='remote')setTimeout(remoteStep,280);
    }else{busy=true;mistakes++;c.classList.add('show','wrong');sfx('bad');await sleep(950);if(!alive(id))return;
      $$('.ncell',board).forEach(x=>x.classList.remove('show','open','wrong'));
      if(!M.solo)nextTurn();await sleep(250);turnStart()}
  }
  function finishNums(winner){
    if(M.solo){const secs=(Date.now()-M.t0)/1000;const perf=clamp(1/(1+mistakes*.3)*clamp(n*3/secs,.5,1),0,1);if(!mistakes)profile.flags.perfect=true;finish({perf,metric:Math.round(perf*100),line:`${mistakes} ${t('mistakes')} · ${Math.round(secs)}s`})}
    else finish({order:M.players.map(p=>({p,val:outVal(p,p===winner?n+1:p.score),txt:p===winner?`${n}/${n}`:`${p.score}/${n}`}))});
  }
  turnStart();
}

/* ---------- Game 3: pairs ---------- */
async function gPairs(){
  const id=M.id,d=M.diff,np=d.cards/2;
  const set=splitEmoji(PAIR_SETS[M.cfg.opts.set||'animals']);
  const cards=gshuffle(gshuffle(set.slice()).slice(0,np).flatMap(e=>[e,e]));
  const extra=M.cfg.opts&&M.cfg.opts.extraTurn!=null?M.cfg.opts.extraTurn:settings.extraTurn;
  const matched=Array(cards.length).fill(null);let open=[],busy=true,moves=0,ended=false;
  M.players.forEach(p=>{p.score=0;if(p.isBot)p.mem={}});
  gameShell();const board=$('#gboard');board.className='gboard pairs';board.dataset.n=d.cards;
  board.innerHTML=cards.map((e,i)=>`<button class="card" data-i="${i}" aria-label="${i+1}"><span class="bk"></span><span class="fc">${e}</span></button>`).join('');
  renderPlayers();
  if(d.peek){$$('.card',board).forEach(c=>c.classList.add('flip'));if(!await countdown(id,d.peek+1,'memorize'))return;$$('.card',board).forEach(c=>c.classList.remove('flip'));sfx('flip');
    M.players.forEach(p=>{if(p.isBot)cards.forEach((e,i)=>{if(rnd()<p.skill*.25)p.mem[i]=e})});await sleep(400)}
  const left=()=>matched.filter(x=>x===null).length/2;
  const say=()=>{const p=curP();status((M.solo?'':t('turnOf',esc(p.name))+' · ')+t('pairsLeft',left()));if(M.solo)p.scoreText=`${moves} ${t('moves')}`;renderPlayers()};
  board.onclick=e=>{const b=e.target.closest('.card');if(!b||busy||ended||!canAct())return;const i=+b.dataset.i;if(matched[i]!==null||open.includes(i)||open.length>=2)return;netAct(i);flip(i)};
  function turnStart(){say();const p=curP();if(p.isBot){busy=true;setTimeout(botTurn,900)}else if(p.remote){busy=true;remoteTurn()}else busy=false}
  async function remoteTurn(){const p=curP();
    while(true){const i=await nextAct(p);if(!alive(id)||ended)return;
      if(i==='OUT'){open.forEach(k=>board.children[k].classList.remove('flip'));open=[];markOut(p);if(alone()){ended=true;return finishPairs()}nextTurn();return turnStart()}
      if(typeof i!=='number'||i<0||i>=cards.length||matched[i]!==null||open.includes(i))continue;
      const second=open.length===1;await flip(i);if(second)return;await sleep(250)}}
  async function botTurn(){if(!alive(id)||ended)return;const p=curP();const free=i=>matched[i]===null&&!open.includes(i);
    const knownIdx=Object.keys(p.mem).map(Number).filter(free);let a=null,b=null;
    for(const i of knownIdx){const j=knownIdx.find(k=>k!==i&&p.mem[k]===p.mem[i]);if(j!=null&&rnd()<p.skill){a=i;b=j;break}}
    if(a==null){const pool=cards.map((_,i)=>i).filter(free);const unk=pool.filter(i=>!(i in p.mem));a=pick(unk.length?unk:pool)}
    await flip(a);if(!alive(id))return;await sleep(600);
    if(b==null){const e=cards[a];const k=Object.keys(p.mem).map(Number).find(k=>k!==a&&free(k)&&p.mem[k]===e);
      if(k!=null&&rnd()<p.skill+.1)b=k;else{const pool=cards.map((_,i)=>i).filter(i=>free(i)&&i!==a);const unk=pool.filter(i=>!(i in p.mem));b=pick(unk.length?unk:pool)}}
    await flip(b)}
  async function flip(i){
    if(matched[i]!==null||open.includes(i)||open.length>=2||ended)return;
    const c=board.children[i];c.classList.add('flip');sfx('flip');open.push(i);
    M.players.forEach(p=>{if(p.isBot&&rnd()<p.skill)p.mem[i]=cards[i]});
    if(open.length<2)return;
    busy=true;moves++;const [a,b]=open;const p=curP();await sleep(650);if(!alive(id))return;
    if(cards[a]===cards[b]){matched[a]=matched[b]=M.cur;[a,b].forEach(k=>{const el=board.children[k];el.classList.add('matched');el.style.setProperty('--owner',p.col)});p.score++;sfx('good');burst(board.children[b],p.col);open=[];
      M.players.forEach(x=>{if(x.isBot){delete x.mem[a];delete x.mem[b]}});
      if(left()===0){ended=true;say();await sleep(600);return finishPairs()}
      if(!M.solo&&!extra)nextTurn();await sleep(250);turnStart()}
    else{sfx('bad');await sleep(500);if(!alive(id))return;board.children[a].classList.remove('flip');board.children[b].classList.remove('flip');open=[];await sleep(300);if(!M.solo)nextTurn();turnStart()}
  }
  function finishPairs(){
    if(M.solo){const secs=(Date.now()-M.t0)/1000;const ratio=moves/np;if(ratio<1.5)profile.flags.eagle=true;const perf=clamp((1.3/ratio)*clamp(np*4.5/secs,.6,1),0,1);finish({perf,metric:Math.round(perf*100),line:`${moves} ${t('moves')} · ${Math.round(secs)}s`})}
    else finish({order:M.players.map(p=>({p,val:outVal(p,p.score),txt:p.score}))});
  }
  turnStart();
}

/* ---------- Game 4: recall & draw ---------- */
const maskCache={};
function strokeMask(draw){const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.lineWidth=11;x.lineCap=x.lineJoin='round';x.strokeStyle='#000';x.scale(.48,.48);draw(x);const d=x.getImageData(0,0,48,48).data;const m=new Uint8Array(2304);for(let i=0;i<2304;i++)m[i]=d[i*4+3]>40?1:0;return m}
const tmplMask=k=>maskCache[k]||(maskCache[k]=strokeMask(x=>x.stroke(new Path2D(SHAPES[k]))));
function userMask(strokes){const pts=strokes.flat();if(!pts.length)return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)});
  const s=74/Math.max(x1-x0,y1-y0,8),ox=50-(x0+x1)/2*s,oy=50-(y0+y1)/2*s;
  return strokeMask(x=>{strokes.forEach(st=>{x.beginPath();st.forEach(([px,py],i)=>{const X=px*s+ox,Y=py*s+oy;i?x.lineTo(X,Y):x.moveTo(X,Y)});if(st.length===1)x.lineTo(st[0][0]*s+ox+.5,st[0][1]*s+oy);x.stroke()})})}
const iou=(a,b)=>{let i=0,u=0;for(let k=0;k<2304;k++){if(a[k]&&b[k])i++;if(a[k]||b[k])u++}return u?i/u:0};
function guessShape(strokes){const m=userMask(strokes);if(!m)return null;let best=null,bv=-1;SHAPE_KEYS.forEach(k=>{const v=iou(m,tmplMask(k));if(v>bv){bv=v;best=k}});return best}
const inkSvg=strokes=>`<svg class="ink" viewBox="0 0 100 100">${strokes.map(s=>`<polyline points="${s.map(p=>p.join(',')).join(' ')}"/>`).join('')}</svg>`;
function drawPad(existing){return new Promise(res=>{
  let strokes=existing?existing.strokes.map(s=>s.slice()):[],label=existing?existing.label:null,auto=!existing;
  modal(`<div class="pad-wrap"><div class="row between"><h3>${t('drawHere')}</h3><button class="btn ghost sm" id="pd-clr">${t('clear')}</button></div>
    <canvas class="pad" id="pd"></canvas><b class="small">${t('whatShape')}</b>
    <div class="shape-chips" id="pd-chips">${SHAPE_KEYS.map(k=>`<button data-k="${k}" title="${t('s_'+k)}">${shapeSvg(k,'')}</button>`).join('')}</div>
    <div class="row" style="justify-content:flex-end;flex-wrap:wrap">${existing?`<button class="btn ghost sm" id="pd-del">${t('remove')}</button>`:''}<button class="btn ghost" id="pd-x">${t('cancel')}</button><button class="btn primary" id="pd-ok">${t('save')}</button></div></div>`,(m,close)=>{
    const cv=$('#pd',m),ctx=cv.getContext('2d');let drawing=null;
    const fit=()=>{const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.width*dpr;redraw()};
    const redraw=()=>{const w=cv.width;ctx.clearRect(0,0,w,w);ctx.lineWidth=w*.03;ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle='#17223A';strokes.forEach(s=>{ctx.beginPath();s.forEach(([x,y],i)=>{const X=x/100*w,Y=y/100*w;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)});if(s.length===1)ctx.lineTo(s[0][0]/100*w+.5,s[0][1]/100*w);ctx.stroke()})};
    const chips=()=>$$('#pd-chips button',m).forEach(b=>b.classList.toggle('on',b.dataset.k===label));
    const pos=e=>{const r=cv.getBoundingClientRect();return[+((e.clientX-r.left)/r.width*100).toFixed(1),+((e.clientY-r.top)/r.height*100).toFixed(1)]};
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drawing=[pos(e)];strokes.push(drawing);redraw()});
    cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e),l=drawing[drawing.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>1.2){drawing.push(p);redraw()}});
    const up=()=>{if(!drawing)return;drawing=null;if(auto){label=guessShape(strokes);chips()}};
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    $('#pd-clr',m).onclick=()=>{strokes=[];auto=true;label=null;redraw();chips()};
    $$('#pd-chips button',m).forEach(b=>b.onclick=()=>{label=b.dataset.k;auto=false;chips()});
    $('#pd-x',m).onclick=()=>{close();res(undefined)};
    const del=$('#pd-del',m);if(del)del.onclick=()=>{close();res(null)};
    $('#pd-ok',m).onclick=()=>{if(!strokes.length||!label){toast(t('whatShape'));return}close();res({strokes,label})};
    requestAnimationFrame(fit);chips();
  })})}
async function gDrawing(){
  const id=M.id,d=M.diff,cells=d.cols*d.rows,humans=M.players.filter(p=>!p.isBot&&!p.remote).length;
  M.players.forEach(p=>{p.score=0;p.scoreText='–'});M.showTurn=true;
  gameShell();const board=$('#gboard'),foot=$('#gfoot');renderPlayers();
  const order=M.players.map((p,i)=>i);const start=M.cur;const seq=M.net?[M.players.findIndex(p=>p.isMe)]:order.map(k=>(k+start)%M.players.length);
  let soloRes=null;
  for(const pi of seq){
    if(!alive(id))return;M.cur=pi;renderPlayers();const p=M.players[pi];
    if(p.isBot){status(t('botPlaying',esc(p.name)));board.innerHTML='';foot.innerHTML='';await sleep(1800+rnd()*1200);if(!alive(id))return;
      p.score=Math.round(clamp(p.skill*85+(rnd()-.5)*30,10,98));p.scoreText=p.score+'%';renderPlayers();continue}
    if(humans>1){board.innerHTML='';foot.innerHTML='';status(t('handoff',esc(p.name)));
      await new Promise(r=>{foot.innerHTML=`<button class="btn primary" id="ho">${t('handoffGo',esc(p.name))}</button>`;$('#ho').onclick=r});if(!alive(id))return}
    const slots=gshuffle([...Array(cells)].map((_,i)=>i)).slice(0,d.n);const layout=Array(cells).fill(null);
    const bag=gshuffle(SHAPE_KEYS.slice());slots.forEach((c,k)=>{layout[c]=k<bag.length?bag[k]:gpick(SHAPE_KEYS)});
    board.className='gboard dgrid';board.style.setProperty('--cols',d.cols);
    board.innerHTML=layout.map(s=>`<div class="dcell">${s?shapeSvg(s):''}</div>`).join('');
    let skip=false;foot.innerHTML=`<button class="btn" id="rdy">${t('ready')}</button>`;$('#rdy').onclick=()=>{skip=true};
    for(let s=d.view;s>0&&!skip;s--){if(!alive(id))return;status(t('viewing',s));if(s<=3)sfx('tick');await sleep(1000)}
    if(!alive(id))return;sfx('flip');
    const ans=Array(cells).fill(null);
    const paint=()=>{board.innerHTML=ans.map((a,i)=>`<button class="dcell tap" data-c="${i}" aria-label="${i+1}">${a?inkSvg(a.strokes)+`<span class="lbl">${shapeSvg(a.label,'')}</span>`:''}</button>`).join('')};
    paint();status(t('recallHint'));
    await new Promise(r=>{foot.innerHTML=`<button class="btn primary" id="fin">${t('finishDraw')}</button>`;$('#fin').onclick=r;
      board.onclick=async e=>{const b=e.target.closest('[data-c]');if(!b)return;sfx('tap');const c=+b.dataset.c;const out=await drawPad(ans[c]);if(out===undefined)return;ans[c]=out;paint()}});
    board.onclick=null;if(!alive(id))return;
    // score
    let ok=0,near=0,sim=0,simN=0;const st=Array(cells).fill('');const usedNear=new Set();
    for(let c=0;c<cells;c++){const a=ans[c],tg=layout[c];
      if(a&&tg&&a.label===tg){ok++;st[c]='ok';const m=userMask(a.strokes);const v=m?iou(m,tmplMask(tg)):0;sim+=v;simN++}
    }
    for(let c=0;c<cells;c++){const a=ans[c],tg=layout[c];if(st[c])continue;
      if(a){const j=layout.findIndex((s,k)=>s===a.label&&!st[k]&&!usedNear.has(k)&&(!ans[k]||ans[k].label!==s));if(j>=0){near++;usedNear.add(j);st[c]='near'}else st[c]='extra'}
      else if(tg)st[c]='miss'}
    const acc=simN?clamp(sim/simN/.42,0,1):0;
    const raw=ok+near*.4+ok*.3*acc,max=d.n*1.3;const pct=Math.round(clamp(raw/max,0,1)*100);
    p.score=pct;p.scoreText=pct+'%';renderPlayers();sfx(pct>=60?'good':'turn');if(M.net)NET.setRes(pct,pct+'%');
    board.innerHTML=layout.map((s,c)=>{const a=ans[c];return`<div class="dcell ${st[c]}">${s?shapeSvg(s):''}${a?`<span class="lbl" style="width:42%">${inkSvg(a.strokes)}</span>`:''}</div>`}).join('');
    status(t('drawScore',ok,near,Math.round(acc*100)));
    foot.innerHTML=`<div class="legend"><span><i style="background:var(--good)"></i>${t('lg_ok')}</span><span><i style="background:var(--c-yellow)"></i>${t('lg_near')}</span><span><i style="background:var(--bad)"></i>${t('lg_miss')}</span><span><i style="background:var(--muted)"></i>${t('lg_extra')}</span></div><button class="btn primary" id="nx">${t('next')}</button>`;
    await new Promise(r=>{$('#nx').onclick=r});
    soloRes={perf:pct/100,metric:pct,line:t('drawScore',ok,near,Math.round(acc*100))};
  }
  if(!alive(id))return;
  if(M.net&&!await waitRemotes(id,v=>v+'%'))return;
  if(M.solo)finish(soloRes);else finish({order:M.players.map(p=>({p,val:outVal(p,p.score),txt:p.score+'%'}))});
}
async function waitRemotes(id,fmt){const rem=M.players.filter(p=>p.remote);if(!rem.length)return alive(id);
  M.showTurn=false;renderPlayers();$('#gboard').innerHTML='';$('#gfoot').innerHTML='';status(t('waitOthers'));
  await Promise.all(rem.map(p=>waitRes(p).then(r=>{if(!alive(id))return;if(r==='OUT'){p.score=0;markOut(p)}else{p.score=Number(r.score)||0;p.scoreText=fmt(p.score)}renderPlayers()})));
  return alive(id)}

/* ---------- Games 5 & 9: sequence engine ---------- */
async function gSequence(isLoc){
  const id=M.id,d=M.diff,n=isLoc?d.grid*d.grid:4,speed=isLoc?560:d.speed;
  const seq=[];for(let i=0;i<60;i++){let v;do{v=Math.floor(grnd()*n)}while(isLoc&&i&&v===seq[i-1]);seq.push(v)}
  const startLen=2,humans=M.players.filter(p=>!p.isBot&&!p.remote).length;
  M.players.forEach(p=>{p.score=0;p.scoreText='–'});
  gameShell();const board=$('#gboard'),foot=$('#gfoot');
  const cols=['red','blue','green','yellow'];
  board.className='gboard '+(isLoc?'locgrid':'seq4');if(isLoc)board.style.setProperty('--cols',d.grid);
  board.innerHTML=[...Array(n)].map((_,i)=>`<button class="spad" data-i="${i}" ${isLoc?'':`style="--pc:var(--c-${cols[i]})"`} aria-label="${isLoc?i+1:t('c_'+cols[i])}"></button>`).join('');
  renderPlayers();
  let accept=false,resolver=null;
  const flash=async(i,ms,bad)=>{const b=board.children[i];b.classList.add(bad?'bad':'lit');if(!bad)sfx('pad',i);else sfx('bad');await sleep(ms);b.classList.remove('lit','bad')};
  board.onclick=e=>{const b=e.target.closest('.spad');if(!b||!accept)return;const i=+b.dataset.i;flash(i,180);resolver&&resolver(i)};
  const start=M.cur;let soloBest=0;
  const turnList=M.net?[M.players.findIndex(p=>p.isMe)]:M.players.map((_,k)=>(start+k)%M.players.length);
  for(let k=0;k<turnList.length;k++){
    const pi=turnList[k];M.cur=pi;renderPlayers();const p=M.players[pi];if(!alive(id))return;
    if(p.isBot){status(t('botPlaying',esc(p.name)));await sleep(1600+rnd()*1200);if(!alive(id))return;const base=isLoc?2.5+p.skill*6:3+p.skill*8;p.score=Math.max(1,Math.round(base+(rnd()*4-2)));p.scoreText=p.score;renderPlayers();continue}
    if(humans>1||k===0){status(humans>1?t('handoff',esc(p.name)):t('tapStart'));await new Promise(r=>{foot.innerHTML=`<button class="btn primary" id="ho">${humans>1?t('handoffGo',esc(p.name)):t('start')}</button>`;$('#ho').onclick=r});foot.innerHTML='';if(!alive(id))return}
    let len=startLen,best=0;
    while(true){
      status(t('round',len-startLen+1)+' · '+t('watch'));await sleep(700);
      for(let s=0;s<len;s++){if(!alive(id))return;await flash(seq[s],speed);await sleep(speed*.35)}
      if(!alive(id))return;status(t('repeat',len));accept=true;let okRun=true;
      for(let s=0;s<len;s++){const v=await new Promise(r=>{resolver=r});if(!alive(id))return;if(v!==seq[s]){okRun=false;break}}
      accept=false;resolver=null;
      if(!okRun){sfx('bad');status(`${t('length')}: ${best}`);await sleep(900);break}
      best=len;p.score=best;p.scoreText=best;renderPlayers();sfx('good');len++;await sleep(500);
    }
    soloBest=best;if(!alive(id))return;if(M.net)NET.setRes(best,String(best));
  }
  if(M.net&&!await waitRemotes(id,v=>String(v)))return;
  if(M.solo){const perf=clamp(soloBest/(isLoc?11:14),0,1);finish({perf,metric:soloBest,line:`${t('length')} ${soloBest}`})}
  else finish({order:M.players.map(p=>({p,val:outVal(p,p.score),txt:p.score}))});
}

/* ========= finish & rewards ========= */
function finish(o){
  if(!M||!M.alive)return;clearInterval(M.tid);M.alive=false;
  const g=M.g,dk=M.diff.k,n=M.players.length,day=today();
  profile.farm=profile.farm[day]?{[day]:profile.farm[day]}:{[day]:{}};
  const fk=g.id+'_'+dk,cnt=profile.farm[day][fk]||0;profile.farm[day][fk]=cnt+1;
  const decay=Math.max(.3,Math.pow(.82,cnt));
  let order=null,myPlace=0,win=false,tie=false;
  if(!M.solo){order=o.order.slice().sort((a,b)=>b.val-a.val);order.forEach((r,i)=>{r.place=i&&r.val===order[i-1].val?order[i-1].place:i});
    const mine=order.find(r=>r.p.isMe);myPlace=mine.place;tie=order.filter(r=>r.place===0).length>1;win=myPlace===0&&!tie}
  const ranked=M.mode!=='local';
  let pts;if(M.solo)pts=25*o.perf*M.diff.mult*decay;else pts=[30,15,8,3][myPlace]*(.7+.15*(n-1))*M.diff.mult*decay*(tie&&myPlace===0?.6:1);
  let xp=Math.round(pts+10*decay);pts=ranked?Math.round(pts):0;
  let dailyBonus=false;if(M.daily&&!profile.daily[day]){profile.daily[day]=true;pts=Math.round(pts*1.5);xp=Math.round(xp*1.5);dailyBonus=true}
  if(profile.lastDay!==day){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);profile.dayStreak=profile.lastDay===y?profile.dayStreak+1:1;profile.lastDay=day}
  const lvBefore=levelOf(profile.xp),rankBefore=myRank('local');
  profile.xp+=xp;profile.points+=pts;profile.matches++;profile.played[g.id]=(profile.played[g.id]||0)+1;
  if(!M.solo){if(win){profile.wins++;profile.winStreak++}else profile.winStreak=0}
  let newBest=false;if(M.solo&&o.metric!=null){const key=g.id+'_'+dk;if(o.metric>(profile.best[key]||0)){newBest=!!profile.best[key];profile.best[key]=o.metric}}
  profile.history.unshift({g:g.id,dk,mode:M.mode,place:M.solo?null:myPlace,n,pts,xp,win,at:Date.now(),line:M.solo?o.line:null});profile.history=profile.history.slice(0,40);
  const newAch=[];ACH.forEach(([k,f])=>{if(!profile.ach.includes(k)&&f(profile)){profile.ach.push(k);newAch.push(k);pushNotif('ach',t('n_ach',t('a_'+k)))}});
  const lvAfter=levelOf(profile.xp);if(lvAfter>lvBefore)pushNotif('lvl',t('n_lvl',lvAfter));
  const rankAfter=myRank('local');if(ranked&&rankAfter<rankBefore)pushNotif('rank',t('n_rank',rankAfter));
  saveAll();
  const res={o,order,myPlace,win,tie,pts,xp,ranked,decay,dailyBonus,lvUp:lvAfter>lvBefore?lvAfter:0,newAch,newBest,cfg:M.cfg,g,diff:M.diff,solo:M.solo,net:M.net};
  M.result=res;
  if(win||(M.solo&&o.perf>=.75)){sfx('win');setTimeout(confetti,150)}else sfx(M.solo?'good':'turn');
  setTimeout(()=>go('results',res),M.solo?400:700);
}

SCREENS.results=function(r){
  if(!r||!r.g){go('home');return}
  const title=r.solo?(r.newBest?t('newBest'):t('wellDone')):r.tie&&r.myPlace===0?t('tie'):r.win?t('youWin'):t('place',r.myPlace+1);
  const shareTxt=`${t('app')} · ${t('g_'+r.g.id)} (${dlabel(r.diff)}): ${r.solo?r.o.line:t('place',r.myPlace+1)} 🧠`;
  app.innerHTML=`<div class="stack"><div class="res-hero"><h1>${title}</h1><p class="muted">${t('g_'+r.g.id)} · ${dlabel(r.diff)} · ${t('m_'+r.cfg.mode)}</p></div>

  <div class="panel"><div class="row between"><span class="lvl">${t('level',levelOf(profile.xp))}</span><span class="small muted tnum">${profile.xp} XP</span></div><div class="xpbar"><i style="width:${Math.round(lvlProgress(profile.xp)*100)}%"></i></div>${r.lvUp?`<p style="margin-top:8px;font-weight:700;color:var(--accent)">${t('levelUp',r.lvUp)}</p>`:''}</div>

  ${r.net?(NET.nr?(NET.isHost?`<div class="row wrap"><button class="btn primary" style="flex:1" id="nrm">${ic('redo')} ${t('rematch')}</button><button class="btn" style="flex:1" id="nbk">${t('backRoom')}</button></div>`
      :`<p class="note" style="text-align:center">${t('waitHost')}</p><button class="btn block" id="nbk">${t('backRoom')}</button>`):'')
   :`<div class="row wrap"><button class="btn primary" style="flex:1" id="rm">${ic('redo')} ${t('rematch')}</button><button class="btn" style="flex:1" data-go="games">${t('otherGame')}</button></div>`}
  <div class="row wrap"><button class="btn ghost" style="flex:1" data-go="home">${ic('home')} ${r.net&&NET.nr?t('leaveRoom'):t('home')}</button><button class="btn ghost" style="flex:1" id="sh">${ic('share')} ${t('share')}</button></div></div>`;
  const rmb=$('#rm');if(rmb)rmb.onclick=()=>{sfx('tap');const c=r.cfg;if(c.mode==='online')go('match',{cfg:{...c,others:null}});else if(c.mode==='friends')startMatch(c);else startMatch({...c,daily:false})};
  const nrm=$('#nrm');if(nrm)nrm.onclick=()=>{sfx('tap');NET.hostStart({game:r.cfg.game,diffIdx:r.cfg.diffIdx,opts:r.cfg.opts})};
  const nbk=$('#nbk');if(nbk)nbk.onclick=()=>{sfx('tap');go('lobby',{})};
  if(r.net&&NET.pending){const pg=NET.pending;setTimeout(()=>{if(current==='results'&&NET.pending===pg&&NET.nr){NET.lastGid=pg.gid;NET.startLocal(pg)}},1500)}

};

    ${rows.slice(0,30).concat(me.rank>30?[me]:[]).map(r=>`<tr class="${r.me?'me':''}"><td>${r.rank}</td><td><span style="font-size:17px">${r.avatar}</span> ${esc(r.u)} ${flag(r.country)}</td><td><b>${r.points.toLocaleString()}</b></td><td>${r.matches}</td><td>${r.wins}</td><td>${r.matches?Math.round(r.wins/r.matches*100):0}%</td></tr>`).join('')}

/* ----- friends ----- */
SCREENS.friends=function(p){
  let tab=p.tab||'list';
  const render=()=>{
    const rq=social.requests.length;
    let body='';
    if(tab==='list'){const fl=social.friends.slice().sort((a,b)=>b.online-a.online);
      body=`<div class="panel list">${fl.map(f=>`<div class="li"><div class="avatar sm">${f.avatar}</div><div class="grow"><b>${esc(f.u)} ${flag(f.country)}</b><span class="small muted"><i class="dot ${f.online?'on':''}"></i>${f.online?t('online_'):t('offline_')} · ${t('lastResult',(f.lastWin?'🏆 ':'')+t('g_'+f.last))}</span></div><button class="btn sm" data-inv="${f.id}">${t('invite')}</button><button class="icon-btn" style="width:36px;height:36px" data-menu="${f.id}" aria-label="…">${ic('dots')}</button></div>`).join('')||`<p class="muted">—</p>`}</div>
      ${social.blocked.length?`<div class="panel" style="margin-top:12px"><h3 style="margin-bottom:6px">${t('blocked')}</h3><div class="list">${social.blocked.map(f=>`<div class="li"><div class="avatar sm">${f.avatar}</div><div class="grow"><b>${esc(f.u)}</b></div><button class="btn ghost sm" data-unb="${f.id}">${t('unblock')}</button></div>`).join('')}</div></div>`:''}`}
    else if(tab==='req'){body=`<div class="panel list">${social.requests.map(f=>`<div class="li"><div class="avatar sm">${f.avatar}</div><div class="grow"><b>${esc(f.u)} ${flag(f.country)}</b></div><button class="btn primary sm" data-acc="${f.id}">${t('accept')}</button><button class="btn ghost sm" data-dec="${f.id}">${t('decline')}</button></div>`).join('')||`<p class="muted">${t('noReq')}</p>`}</div>`}
    else{body=`<div class="panel stack"><div class="row"><input type="text" id="fs" placeholder="${t('searchUser')}" dir="ltr" aria-label="${t('searchUser')}"></div><div class="list" id="fs-res"></div></div>`}
    app.innerHTML=head(t('friends'))+`<div class="tabs"><button data-tab="list" class="${tab==='list'?'on':''}">${t('f_list')} ${social.friends.length}</button><button data-tab="req" class="${tab==='req'?'on':''}">${t('f_req')}${rq?` (${rq})`:''}</button><button data-tab="add" class="${tab==='add'?'on':''}">${ic('plus')} ${t('f_add')}</button></div>${body}`;
    $$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
    $$('[data-inv]').forEach(b=>b.onclick=()=>{sfx('tap');go('games',{mode:'friends',invite:b.dataset.inv})});
    $$('[data-acc]').forEach(b=>b.onclick=()=>{const i=social.requests.findIndex(f=>f.id===b.dataset.acc);const f=social.requests.splice(i,1)[0];social.friends.push({...f,last:'pairs',lastWin:false});saveAll();sfx('good');render()});
    $$('[data-dec]').forEach(b=>b.onclick=()=>{social.requests=social.requests.filter(f=>f.id!==b.dataset.dec);saveAll();render()});
    $$('[data-unb]').forEach(b=>b.onclick=()=>{social.blocked=social.blocked.filter(f=>f.id!==b.dataset.unb);saveAll();render()});
    $$('[data-menu]').forEach(b=>b.onclick=()=>friendMenu(social.friends.find(f=>f.id===b.dataset.menu),render));
    const fs=$('#fs');if(fs){const show=()=>{const q=fs.value.trim().toLowerCase();const res=$('#fs-res');if(q.length<2){res.innerHTML='';return}
      const hits=LBP.filter(x=>x.u.includes(q)&&!social.friends.some(f=>f.u===x.u)&&!social.blocked.some(f=>f.u===x.u)).slice(0,8);
      res.innerHTML=hits.map(h=>{const sent=social.sent.includes(h.u);return`<div class="li"><div class="avatar sm">${h.avatar}</div><div class="grow"><b>${esc(h.u)} ${flag(h.country)}</b><span class="small muted">${h.points.toLocaleString()} ${t('pts')}</span></div><button class="btn sm ${sent?'ghost':''}" data-send="${h.u}" ${sent?'disabled':''}>${sent?t('reqSent'):t('sendReq')}</button></div>`}).join('')||`<p class="muted small">${t('notFound')}</p>`;
      $$('[data-send]',res).forEach(b=>b.onclick=()=>{social.sent.push(b.dataset.send);saveAll();toast(t('reqSent'));show()})};fs.oninput=show;fs.focus()}
  };render();
};
function friendMenu(f,rerender){modal(`<div class="row" style="margin-bottom:12px"><div class="avatar">${f.avatar}</div><div><b>${esc(f.u)}</b><div class="small muted">${flag(f.country)} ${ctyName(f.country)}</div></div></div>
  <div class="stack" style="gap:8px"><button class="btn block ghost" data-a="unf">${t('unfriend')}</button><button class="btn block ghost" data-a="blk">${ic('ban')} ${t('block')}</button><button class="btn block ghost" data-a="rep" style="color:var(--bad)">${ic('flag')} ${t('report')}</button></div>`,(m,close)=>{
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;close();
    if(b.dataset.a==='unf'){social.friends=social.friends.filter(x=>x.id!==f.id);saveAll();rerender()}
    if(b.dataset.a==='blk'){if(await confirmBox(t('blockQ',f.u),t('block'))){social.friends=social.friends.filter(x=>x.id!==f.id);social.blocked.push(f);saveAll();rerender()}}
    if(b.dataset.a==='rep')reportModal(f)})})}
function reportModal(f){modal(`<h3 style="margin-bottom:12px">${t('reportT',esc(f.u))}</h3><div class="stack" style="gap:8px">${['rp1','rp2','rp3','rp4'].map((k,i)=>`<label class="row" style="background:var(--bg2);border-radius:12px;padding:10px;cursor:pointer"><input type="radio" name="rp" value="${k}" ${i?'':'checked'}> ${t(k)}</label>`).join('')}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-r="0">${t('cancel')}</button><button class="btn primary" data-r="1">${t('sendReport')}</button></div>`,(m,close)=>{m.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;close();if(b.dataset.r==='1')toast(t('reportSent'))})})}

/* ----- profile ----- */
SCREENS.profile=function(){
  const lv=levelOf(profile.xp),wr=profile.matches?Math.round(profile.wins/profile.matches*100):0;
  const fav=Object.entries(profile.played).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const bests=Object.entries(profile.best);
  app.innerHTML=head(t('profile'),'home',`<button class="btn ghost sm" id="ed">${t('edit')}</button>`)+`<div class="stack">
  <div class="panel row" style="gap:14px"><div class="avatar lg">${profile.avatar}</div><div style="flex:1;min-width:0"><h2 style="overflow:hidden;text-overflow:ellipsis">${esc(profile.name)}</h2><div class="muted small">${flag(profile.country)} ${ctyName(profile.country)}</div><div class="row" style="gap:8px;margin-top:4px"><span class="lvl">${t('level',lv)}</span><span class="small muted tnum">${profile.xp} XP</span></div><div class="xpbar"><i style="width:${Math.round(lvlProgress(profile.xp)*100)}%"></i></div></div></div>
  <div class="panel"><div class="stats"><div><b class="tnum">${profile.points}</b><span>${t('pointsL')}</span></div><div><b class="tnum">${profile.matches}</b><span>${t('matches')}</span></div><div><b class="tnum">${profile.wins}</b><span>${t('wins')}</span></div><div><b class="tnum">${wr}%</b><span>${t('winRate')}</span></div></div>
    <div class="stats" style="grid-template-columns:1fr 1fr;margin-top:8px"><div><b class="tnum">#${myRank('local')}</b><span>${t('rankLocal')} ${flag(profile.country)}</span></div><div><b class="tnum">#${myRank('global')}</b><span>${t('rankGlobal')}</span></div></div></div>
  ${fav.length?`<div class="panel"><h3 style="margin-bottom:8px">${t('favGames')}</h3><div class="chips">${fav.map(([g,c])=>`<span class="chip on">${t('g_'+g)} · ${c}</span>`).join('')}</div></div>`:''}
  ${bests.length?`<div class="panel"><h3 style="margin-bottom:6px">${t('bestScores')}</h3><div class="list">${bests.map(([k,v])=>{const[g,d]=k.split('_');const gd=GAME(g).diffs.find(x=>x.k===d);return`<div class="li"><div class="grow"><b>${t('g_'+g)}</b><span class="small muted">${gd?dlabel(gd):''}</span></div><b class="tnum" style="font-family:var(--f-display);font-size:18px;color:var(--teal)">${v}${['sequence','locations'].includes(g)?'':'%'}</b></div>`}).join('')}</div></div>`:''}
  <div class="panel"><h3 style="margin-bottom:10px">${t('achievements')} <span class="muted small">${profile.ach.length}/${ACH.length}</span></h3><div class="ach-grid">${ACH.map(([k])=>`<div class="ach ${profile.ach.includes(k)?'on':''}"><span class="medal">★</span><div style="min-width:0"><b>${t('a_'+k)}</b><span>${t('a_'+k+'D')}</span></div></div>`).join('')}</div></div>
  <div class="panel"><h3 style="margin-bottom:6px">${t('history')}</h3><div class="list">${profile.history.slice(0,15).map(h=>`<div class="li"><div class="grow"><b>${t('g_'+h.g)}</b><span class="small muted">${t('m_'+h.mode)} · ${h.place==null?esc(h.line||''):t('place',h.place+1)+' / '+h.n} · ${ago(h.at)}</span></div><span class="small tnum" style="color:var(--accent);font-weight:700">+${h.pts}</span></div>`).join('')||`<p class="muted">${t('noHistory')}</p>`}</div></div></div>`;
  $('#ed').onclick=editProfile;
};
function editProfile(){let av=profile.avatar;modal(`<h3 style="margin-bottom:12px">${t('editProfile')}</h3><div class="stack"><label class="field">${t('username')}<input type="text" id="ep-n" maxlength="16" dir="ltr" value="${esc(profile.name)}"></label><div class="av-pick">${AVATARS.map(a=>`<button type="button" data-av="${a}" class="${a===av?'on':''}">${a}</button>`).join('')}</div><label class="field">${t('country')}<select id="ep-c">${COUNTRIES.map(c=>`<option value="${c[0]}" ${c[0]===profile.country?'selected':''}>${c[1]} ${L()?c[3]:c[2]}</option>`).join('')}</select></label><p class="small" id="ep-e" style="color:var(--bad)"></p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="ep-x">${t('cancel')}</button><button class="btn primary" id="ep-s">${t('save')}</button></div></div>`,(m,close)=>{
  $$('[data-av]',m).forEach(b=>b.onclick=()=>{av=b.dataset.av;$$('[data-av]',m).forEach(x=>x.classList.toggle('on',x===b))});
  $('#ep-x',m).onclick=close;$('#ep-s',m).onclick=()=>{const n=$('#ep-n',m).value.trim();if(!/^[\p{L}\p{N}_]{3,16}$/u.test(n)){$('#ep-e',m).textContent=t('errName');return}profile.name=n;profile.avatar=av;profile.country=$('#ep-c',m).value;saveAll();if(NET.api)NET.api.presence(me0()).catch(()=>{});close();SCREENS.profile()}})}

  const bind=(id,fn)=>{$('#'+id).onclick=()=>{fn();store.set('settings',settings);SCREENS.settings()}};
  bind('s-sound',()=>{settings.sound=!settings.sound;if(settings.sound)sfx('good')});bind('s-music',()=>{settings.music=!settings.music;ac();musicSync()});bind('s-xt',()=>settings.extraTurn=!settings.extraTurn);
  ['friend','invite','rank','ach','online'].forEach(k=>bind('n-'+k,()=>settings.notif[k]=!settings.notif[k]));

  $('#pp').onclick=()=>info(t('privacy'),t('privacyTxt'));$('#tm').onclick=()=>info(t('terms'),t('termsTxt'));
  $('#rs').onclick=async()=>{if(await confirmBox(t('resetQ'),t('reset'))){try{['profile','social','notifs'].forEach(k=>localStorage.removeItem('zk_'+k))}catch(e){}profile=null;social=null;notifs=[];SCREENS.onboard();$('#ad').hidden=true;document.body.classList.remove('has-ad')}};
};

if(NATIVE){const A=PLUG('App');
