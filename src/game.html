    board.innerHTML=`<div class="qcard"><div class="qtimer"><i id="qbar"></i></div>${qzImg(q)}<p class="dq">${dqHtml(q)}</p></div><p class="small muted" style="text-align:center;margin:12px 0 8px">${t('dcSoloPick')}</p><div class="dopts">${opts.map((o,k)=>`<button class="dopt" data-k="${k}"><span>${esc(o.txt)}</span></button>`).join('')}</div>`;
    const limit=25,t0=performance.now(),k=await timedPick(id,board,'.dopt',limit,t0);if(!alive(id))return;
    const ok=k>=0&&opts[k].truth,gain=ok?DC.TRUTH:0;if(ok)correct++;
    me.score+=gain;me.scoreText=me.score;renderPlayers();
    $$('.dopt',board).forEach((b,j)=>{b.disabled=true;if(opts[j].truth){b.classList.add('truth');b.insertAdjacentHTML('beforeend',`<span class="who"><span class="tag">${t('dcTruth')}</span></span>`)}else if(j===k)b.classList.add('picked');else b.style.opacity='.45'});
    sfx(ok?'good':'bad');status(ok?t('dcGotTruth',gain):k<0?t('qTimeout'):t('qWrong'));
    const ai=showAImg(board,q);await sleep(2300+(ai?1200:0));if(!alive(id))return;
  }
  finish({perf:correct/qs.length,metric:me.score,line:`${t('correctN',correct+'/'+qs.length)} · ${me.score} ${t('pts')}`});
}
/* Multiplayer: the host (room creator, or this device when playing virtual players) runs the round:
   collects lies, builds the options, collects picks, scores, and publishes one state everyone renders. */
async function deceitMulti(id,qs){
  const board=$('#gboard'),me=M.players.find(p=>p.isMe)||(M.tvHost?{id:'__tv',name:'TV'}:M.players[0]),host=!M.net||NET.isHost;
  const gid=M.net?NET.game.gid:'local';
  const nameOf=pid=>{const p=M.players.find(x=>x.id===pid);return p?p.name:'?'};
  const myFake={},myPick={};let S=null,lastKey='',deadline=0;
  const tick=()=>{if(!alive(id))return;const bar=$('#qbar');if(bar&&S&&S.lim)bar.style.width=Math.max(0,(deadline-Date.now())/S.lim*100)+'%';requestAnimationFrame(tick)};requestAnimationFrame(tick);
  function render(){if(!alive(id)||!S)return;const q=qs[S.q];if(!q)return;
    M.players.forEach(p=>{p.score=(S.sc&&S.sc[p.id])||0;p.scoreText=p.score});renderPlayers();
    const key=[S.q,S.stage,(S.done||[]).join(','),myFake[S.q]!=null,myPick[S.q]!=null].join('|');if(key===lastKey)return;lastKey=key;
    const waiting=M.players.filter(p=>!p.out&&!(S.done||[]).includes(p.id)).map(p=>esc(p.name)).join('، ');
    const qh=`<div class="qcard">${S.stage==='reveal'?'':'<div class="qtimer"><i id="qbar"></i></div>'}${S.stage==='reveal'&&q.aimg?qzAImg(q):qzImg(q)}<p class="dq">${dqHtml(q)}</p></div>`;
    board.onclick=null;
    if(S.stage==='write'){status(t('dcRound',S.q+1,qs.length));
      if(myFake[S.q]==null&&!M.tvHost){
        board.innerHTML=qh+`<form class="stack" id="dcf" style="margin-top:12px;gap:8px"><p class="small muted" style="text-align:center">${t('dcWrite')}</p><div class="wbox"><input type="text" id="dci" maxlength="40" autocomplete="off" placeholder="${t('dcWritePh')}"><button class="btn primary" type="submit">${t('dcSend')}</button></div><p class="small" id="dce" style="color:var(--bad);min-height:18px"></p></form>`;
        $('#dcf').onsubmit=e=>{e.preventDefault();const v=$('#dci').value.trim();if(!v)return;if(isTruth(q,v)){$('#dce').textContent=t('dcTooTrue');sfx('bad');return}
          myFake[S.q]=v.slice(0,40);sfx('tap');submit();lastKey='';render()};
        setTimeout(()=>{const i=$('#dci');if(i)i.focus()},60)}
      else board.innerHTML=qh+`${M.tvHost?`<p class="tv-sub" style="text-align:center">${t('dc_tvWrite')}</p>`:''}<p class="note" style="margin-top:12px;text-align:center">${t('dcWaiting',waiting||'…')}</p>`}
    else if(S.stage==='pick'){status(t('dcRound',S.q+1,qs.length));
      const mine=S.by.map(b=>Array.isArray(b)&&b.includes(me.id)),picked=myPick[S.q];
      board.innerHTML=qh+`<p class="small muted" style="text-align:center;margin:12px 0 8px">${picked!=null?t('dcWaiting',waiting||'…'):t('dcPick')}</p><div class="dopts">${S.opts.map((o,k)=>`<button class="dopt ${mine[k]?'mine':''} ${picked===k?'picked':''}" data-k="${k}" ${mine[k]||picked!=null?'disabled':''}><span>${esc(o)}</span>${mine[k]?`<span class="who"><span class="tag">${t('dcYours')}</span></span>`:''}</button>`).join('')}</div>`;
      if(picked==null&&!M.tvHost)board.onclick=e=>{const b=e.target.closest('.dopt');if(!b||b.disabled||myPick[S.q]!=null)return;myPick[S.q]=+b.dataset.k;sfx('tap');submit();lastKey='';render()}}
    else if(S.stage==='reveal'){
      const picks=S.picks||{};
      board.innerHTML=qh+`<div class="dopts" style="margin-top:12px">${S.opts.map((o,k)=>{const by=S.by[k];
        const tag=by===null?t('dcTruth'):by==='bank'?t('dcBank'):t('dcBy',by.map(nameOf).join('، '));
        const who=Object.keys(picks).filter(pid=>picks[pid]===k).map(pid=>{const p=M.players.find(x=>x.id===pid);return p?`<span>${esc(p.avatar)} ${esc(p.name)}</span>`:''}).join('');
        return`<div class="dopt ${by===null?'truth':''}"><span>${esc(o)}</span><span class="who"><span class="tag">${esc(tag)}</span>${who}</span></div>`}).join('')}</div>`;
      const mp=picks[me.id];let line=mp==null?t('dcNoPick'):S.by[mp]===null?t('dcGotTruth',DC.TRUTH):Array.isArray(S.by[mp])?t('dcGotFooled',S.by[mp].map(nameOf).join('، ')):t('qWrong');
      const fooled=Object.keys(picks).filter(pid=>pid!==me.id&&Array.isArray(S.by[picks[pid]])&&S.by[picks[pid]].includes(me.id)).map(nameOf);
      if(fooled.length)line+=' · '+t('dcFooled',fooled.join('، '),fooled.length*DC.FOOL);
      if(M.tvHost)status(t('dcRound',S.q+1,qs.length));else status(esc(line));sfx(((S.gain||{})[me.id]||0)>0?'good':'turn')}
  }
  function endGame(){if(!alive(id))return;NET.onTick=null;M.players.forEach(p=>{p.score=(S&&S.sc&&S.sc[p.id])||0;p.scoreText=p.score});
    if(M.tvHost){const w={};M.players.forEach(p=>w[p.id]={nm:p.name,av:p.avatar});tvFinal(board,M.players.slice().sort((a,b)=>b.score-a.score).map(p=>[p.id,p.score]),w);return}
    finish({order:M.players.map(p=>({p,val:outVal(p,p.score),txt:p.score}))})}

  /* ----- guest: render what the host publishes, send own lie/pick through presence ----- */
  if(!host){
    let hostGoneAt=0;
    var submit=()=>{const q=S?S.q:0;NET.set({dc:{gid,q,fake:myFake[q]==null?null:myFake[q],pick:myPick[q]==null?null:myPick[q]}})};
    NET.onTick=()=>{if(!alive(id)){NET.onTick=null;return}const h=NET.host();
      if(h&&h.dl&&h.dl.gid===gid){hostGoneAt=0;const prevQ=S?S.q:-1;S=h.dl;deadline=Date.now()+(S.left||0);if(S.q!==prevQ)lastKey='';render();if(S.stage==='end')endGame()}
      else if(!h){if(!hostGoneAt)hostGoneAt=Date.now()}};
    NET.onTick();
    while(alive(id)){await sleep(1000);if(hostGoneAt&&Date.now()-hostGoneAt>20000){toast(t('dcHostLeft'));endGame();return}}
    return}

  /* ----- host ----- */
  const inputs={};const inp=q=>inputs[q]||(inputs[q]={fake:{},pick:{}});
  let waker=null;const wake=()=>{if(waker){const w=waker;waker=null;w()}};
  const engineIn=(pid,kind,q,val)=>{const I=inp(q);if(kind==='fake'){if(I.fake[pid]==null&&typeof val==='string')I.fake[pid]=val.slice(0,40)}else if(I.pick[pid]==null&&typeof val==='number')I.pick[pid]=val;wake()};
  var submit=()=>{const q=S.q;if(myFake[q]!=null)engineIn(me.id,'fake',q,myFake[q]);if(myPick[q]!=null)engineIn(me.id,'pick',q,myPick[q])};
  if(M.net)NET.onTick=()=>{if(!alive(id)){NET.onTick=null;return}
    M.players.forEach(p=>{if(!p.remote)return;const x=NET.pres&&NET.pres[p.id],dc=x&&x.dc;if(!dc||dc.gid!==gid||typeof dc.q!=='number')return;
      if(dc.fake!=null)engineIn(p.id,'fake',dc.q,String(dc.fake));if(dc.pick!=null)engineIn(p.id,'pick',dc.q,+dc.pick)});wake()};
  const pub=()=>{S.left=Math.max(0,deadline-Date.now());if(M.net)NET.set({dl:JSON.parse(JSON.stringify(S))});render()};
  const active=()=>M.players.filter(p=>!p.out);
  async function waitFor(cond,ms,doneOf){deadline=Date.now()+ms;S.lim=ms;S.done=[];pub();
    while(alive(id)&&Date.now()<deadline){
      if(M.net)M.players.forEach(p=>{if(p.remote&&!p.out&&NET.gone[p.id]&&Date.now()-NET.gone[p.id]>20000)markOut(p)});
      const dn=active().filter(doneOf).map(p=>p.id);if(dn.join()!==S.done.join()){S.done=dn;pub()}
      if(cond())break;await new Promise(r=>{waker=r;setTimeout(r,400)})}}
  const botsWrite=(qi,q)=>{const used=new Set();M.players.filter(p=>p.isBot).forEach(p=>{const f=shuffle(q.f.filter(x=>!used.has(x)))[0];if(!f)return;used.add(f);setTimeout(()=>alive(id)&&engineIn(p.id,'fake',qi,f),2500+rnd()*9000)})};
  const botsPick=qi=>{M.players.filter(p=>p.isBot).forEach(p=>setTimeout(()=>{if(!alive(id))return;const ok=S.by.map((b,k)=>k).filter(k=>!(Array.isArray(S.by[k])&&S.by[k].includes(p.id)));
    const truth=S.by.indexOf(null);engineIn(p.id,'pick',qi,rnd()<p.skill*.7?truth:pick(ok))},2000+rnd()*7000))};
  S={gid,q:0,stage:'write',opts:null,by:null,picks:{},gain:{},sc:{},done:[],lim:0,left:0};M.players.forEach(p=>S.sc[p.id]=0);
  for(let i=0;i<qs.length;i++){if(!alive(id))return;
    const q=qs[i],I=inp(i);Object.assign(S,{q:i,stage:'write',opts:null,by:null,picks:{},gain:{}});lastKey='';
    botsWrite(i,q);
    await waitFor(()=>active().every(p=>I.fake[p.id]!=null),45000,p=>I.fake[p.id]!=null);if(!alive(id))return;
    const list=[{txt:q.a,by:null}];
    active().forEach(p=>{const f=I.fake[p.id];if(f==null||!f.trim()||isTruth(q,f))return;const ex=list.find(o=>normA(o.txt)===normA(f));if(ex){if(Array.isArray(ex.by))ex.by.push(p.id)}else list.push({txt:f.trim(),by:[p.id]})});
    const bank=shuffle(q.f.filter(f=>!list.some(o=>normA(o.txt)===normA(f))));
    /* everyone wrote a lie → only the truth and their lies; each player who wrote nothing adds one ready-made wrong answer
       (never one a player already wrote, since those were removed from the bank above) */
    let missing=active().filter(p=>{const f=I.fake[p.id];return f==null||!String(f).trim()||isTruth(q,f)}).length;
    while(missing>0&&bank.length){list.push({txt:bank.shift(),by:'bank'});missing--}
    if(list.length<2&&bank.length)list.push({txt:bank.shift(),by:'bank'});
    const opts=shuffle(list);Object.assign(S,{stage:'pick',opts:opts.map(o=>o.txt),by:opts.map(o=>o.by)});
    botsPick(i);
    await waitFor(()=>active().every(p=>I.pick[p.id]!=null),30000,p=>I.pick[p.id]!=null);if(!alive(id))return;
    const gain={},picks={};M.players.forEach(p=>gain[p.id]=0);
    Object.keys(I.pick).forEach(pid=>{const k=I.pick[pid];if(!(k>=0&&k<S.opts.length))return;const by=S.by[k];if(Array.isArray(by)&&by.includes(pid))return;picks[pid]=k;
      if(by===null)gain[pid]+=DC.TRUTH;else if(Array.isArray(by))by.forEach(a=>{if(a!==pid)gain[a]+=DC.FOOL})});
    Object.keys(gain).forEach(pid=>S.sc[pid]=(S.sc[pid]||0)+gain[pid]);
    Object.assign(S,{stage:'reveal',picks,gain,done:[]});deadline=Date.now()+7000;S.lim=7000;lastKey='';pub();
    await sleep(7000);
  }
  if(!alive(id))return;S.stage='end';pub();await sleep(400);endGame();
}

/* ========= finish & rewards ========= */
function finish(o){
  if(!M||!M.alive)return;clearInterval(M.tid);M.alive=false;
  if(M.tvHost){const ord=(o.order||[]).slice().sort((a,b)=>b.val-a.val);sfx('win');setTimeout(()=>typeof confetti==='function'&&confetti(),200);
    app.innerHTML=`<section class="tvs tv-end"><h2 class="tv-h">${t('qzFinal')} · ${t('g_'+M.g.id)}</h2><div class="tv-ranks">${ord.map((x,k)=>`<div class="tv-rank ${k===0?'first':''}"><b class="tnum">${k===0?'🏆':k+1}</b><span>${esc(x.p.avatar)} ${esc(x.p.name)}</span><span class="tnum">${esc(String(x.txt!=null?x.txt:x.val))}</span></div>`).join('')}</div><button class="btn primary tv-next" id="tvagain">${ic('redo')} ${t('qzNewRound')}</button></section>`;
    $('#tvagain').onclick=()=>go('lobby',{});return}
  const g=M.g,dk=M.diff.k,n=M.players.length,day=today();
  profile.farm=profile.farm[day]?{[day]:profile.farm[day]}:{[day]:{}};
  const fk=g.id+'_'+dk,cnt=profile.farm[day][fk]||0;profile.farm[day][fk]=cnt+1;
  const decay=Math.max(.3,Math.pow(.82,cnt));
  let order=null,myPlace=0,win=false,tie=false;
  if(!M.solo){order=o.order.slice().sort((a,b)=>b.val-a.val);order.forEach((r,i)=>{r.place=i&&r.val===order[i-1].val?order[i-1].place:i});
    const mine=order.find(r=>r.p.isMe);myPlace=mine.place;tie=order.filter(r=>r.place===0).length>1;win=myPlace===0&&!tie}
  const ranked=M.mode!=='local';
  let pts;if(M.solo)pts=25*o.perf*M.diff.mult*decay;else pts=([30,15,8,3][myPlace]||2)*(.7+.15*(Math.min(n,4)-1))*M.diff.mult*decay*(tie&&myPlace===0?.6:1);
  let xp=Math.round(pts+10*decay);pts=ranked?Math.round(pts):0;
  let dailyBonus=false;if(M.daily&&!profile.daily[day]){profile.daily[day]=true;pts=Math.round(pts*1.5);xp=Math.round(xp*1.5);dailyBonus=true}
  if(profile.lastDay!==day){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);profile.dayStreak=profile.lastDay===y?profile.dayStreak+1:1;profile.lastDay=day}
  const lvBefore=levelOf(profile.xp),rankBefore=myRank('local');
  profile.xp+=xp;profile.points+=pts;profile.matches++;profile.played[g.id]=(profile.played[g.id]||0)+1;
  const GS=profile.gstats||(profile.gstats={}),gs=GS[g.id]||(GS[g.id]={n:0,w:0,pts:0,last:0});gs.n++;if(win)gs.w++;gs.pts+=pts;gs.last=Date.now();
  const DY=profile.days||(profile.days={});DY[day]=(DY[day]||0)+1;Object.keys(DY).sort().slice(0,-60).forEach(k=>delete DY[k]);
  if(M.mode!=='local')ACC.logMatch({game:g.id,mode:M.mode,place:M.solo?null:myPlace,players:n,pts,win});
  if(!M.solo){if(win){profile.wins++;profile.winStreak++}else profile.winStreak=0}
  let newBest=false;if(M.solo&&o.metric!=null){const key=g.id+'_'+dk,prev=profile.best[key];if(prev==null||(g.lower?o.metric<prev:o.metric>prev)){newBest=prev!=null;profile.best[key]=o.metric}}
  profile.history.unshift({g:g.id,dk,mode:M.mode,place:M.solo?null:myPlace,n,pts,xp,win,at:Date.now(),line:M.solo?o.line:null});profile.history=profile.history.slice(0,40);
  const newAch=[];ACH.forEach(([k,f])=>{if(!profile.ach.includes(k)&&f(profile)){profile.ach.push(k);newAch.push(k);pushNotif('ach',t('n_ach',t('a_'+k)))}});
  const lvAfter=levelOf(profile.xp);if(lvAfter>lvBefore)pushNotif('lvl',t('n_lvl',lvAfter));
  const rankAfter=myRank('local');if(ranked&&rankAfter<rankBefore)pushNotif('rank',t('n_rank',rankAfter));
  saveAll();ACC.later();
  const res={o,order,myPlace,win,tie,pts,xp,ranked,decay,dailyBonus,lvUp:lvAfter>lvBefore?lvAfter:0,newAch,newBest,cfg:M.cfg,g,diff:M.diff,solo:M.solo,net:M.net};
  M.result=res;
  if(win||(M.solo&&o.perf>=.75)){sfx('win');setTimeout(confetti,150)}else sfx(M.solo?'good':'turn');
  setTimeout(()=>go('results',res),M.solo?400:700);
}

const ADM={ok:false,checked:false};

/* images go to the public "qimg" bucket, shrunk to 1000 px so they load fast on phones */
async function uploadImg(file){const sb=ACC.client();if(!sb||!ACC.user){toast(t('adm_upLogin'));return null}
  try{const bmp=await createImageBitmap(file),k=Math.min(1,1000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)),name=(ADM.ok?'':'u/'+ACC.user.id+'/')+newQid()+'.jpg';
    const {error}=await sb.storage.from('qimg').upload(name,blob,{contentType:'image/jpeg',upsert:true});if(error)throw error;
    return sb.storage.from('qimg').getPublicUrl(name).data.publicUrl}catch(e){toast(t('adm_upFail'));return null}}
const newQid=()=>'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src=ZKC.xlsxUrl||'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s)})}
/* Excel layout (see the template): sheet "أسئلة": category, question, correct, wrong 1..3, image link, double (نعم).
   sheet "خداع": category, question with ____, answer, other accepted answers (comma separated), lie 1..5, image link */
function parseWorkbook(X,wb){const out={quiz:[],deceit:[]};
  wb.SheetNames.forEach(name=>{const rows=X.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''}).map(r=>r.map(c=>qn(c)));if(!rows.length)return;
    const head=rows[0].join(' ');const isDeceit=/خداع|decept|deceit|bluff/i.test(name)||/خداع|lie|fake/i.test(head);
    const body=/سؤال|السؤال|question/i.test(head)?rows.slice(1):rows;
    body.forEach(r=>{if(!r[1]||!r[2])return;
      if(isDeceit){const q=mkDeceit(newQid(),r[0],r[1],r[2],r.slice(4,9),r[3]?r[3].split(/[,،]/):[],'l',{img:r[9],aimg:r[10]});if(q.f.length>=1)out.deceit.push(q)}
      else{const ty=/ترتيب|order/i.test(r[9]||'')?'order':/كتاب|type|write/i.test(r[9]||'')?'type':'',ex={img:r[6],aimg:r[8],x2:/^(نعم|yes|y|x2|×2|2|✓|true)$/i.test(r[7]||''),qt:ty};const q=ty==='type'?mkQuiz(newQid(),r[0],r[1],[r[2]],20,'l',{...ex,alt:[r[3],r[4],r[5]]}):mkQuiz(newQid(),r[0],r[1],[r[2],r[3],r[4],r[5]],20,'l',ex);if(usableQ('quiz',q))out.quiz.push(q)}})});
  return out}
/* ========= ADMIN DASHBOARD (#admin): overview · players · questions · games · codes =========
   With the server connected it reads live data (admin_stats, profiles, promo_codes) and only an admin
   account gets anything back. Without a server (preview) it shows clearly marked sample players. */
/* revenue & subscribers block on the overview (live: admin_stats; preview: sample numbers) */
const money=v=>'$'+(Math.round((+v||0)*100)/100).toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:2});
const prodName=k=>PRODUCTS[k]?(PRODUCTS[k].pass?t('pass_'+PRODUCTS[k].pass):tierName(PRODUCTS[k].tier)+' · '+t(PRODUCTS[k].per==='perYear'?'plYearly':'plMonthly')):k;
function demoRevenue(){const R=mulberry(23),now=Date.now(),keys=Object.keys(PRODUCTS),pr=k=>parseFloat(DEF_PRICES[k]);
  const days=[...Array(30)].map((_,i)=>({d:new Date(now-(29-i)*864e5).toISOString().slice(0,10),v:Math.round((40+R()*90+i*3)*100)/100}));
  const months=[...Array(12)].map((_,i)=>{const d=new Date(now);d.setMonth(d.getMonth()-(11-i));return{m:d.toISOString().slice(0,7),v:Math.round((600+i*260+R()*400)*100)/100}});
  const products={};keys.forEach(k=>{const n=Math.floor(R()*(PRODUCTS[k].pass?60:25))+3;products[k]={n,v:Math.round(n*pr(k)*100)/100}});
  return{tiers:{plus:Math.floor(40+R()*30),premium:Math.floor(15+R()*20)},passes_active:Math.floor(R()*12),rev_today:days[29].v,rev_month:months[11].v,rev_days30:days,rev_months12:months,products30:products}}
function revHtml(S){const tiers=S.tiers||{},days=S.rev_days30||[],mons=S.rev_months12||[],pr=Object.entries(S.products30||{}).sort((a,b)=>(b[1].v||0)-(a[1].v||0));

/* a player types a code on the subscription screen */
async function redeem(code){
  const sb=ACC.client();
  if(sb){if(!ACC.user)return{ok:false,err:'login'};try{const {data,error}=await sb.rpc('redeem_code',{p_code:code});if(error)return{ok:false,err:'bad'};if(data&&data.ok)await ACC.pullEnt();return data||{ok:false,err:'bad'}}catch(e){return{ok:false,err:'bad'}}}
  const Lc=store.get('demo_codes',[]),c=Lc.find(x=>x.code===code);if(!c)return{ok:false,err:'bad'};      // preview: codes made on this device
  if(c.expires_at&&Date.parse(c.expires_at)<Date.now())return{ok:false,err:'expired'};if((c.uses||0)>=c.max_uses)return{ok:false,err:'used'};
  const used=store.get('demo_used',[]);if(used.includes(code))return{ok:false,err:'again'};used.push(code);store.set('demo_used',used);c.uses=(c.uses||0)+1;store.set('demo_codes',Lc);
  if(c.kind==='days')setEnt({until:Math.max(Date.now(),ENT.until||0)+c.days*864e5,plan:'gift',tier:c.tier==='premium'||tierOf()==='premium'?'premium':'plus',src:'test'});
  else if(c.kind==='games')setPerks({...PERKS,games:[...new Set([...(PERKS.games||[]),...c.games])]});
  else setPerks({...PERKS,discount:Math.max(PERKS.discount||0,c.percent)});
  return{ok:true,kind:c.kind,days:c.days,games:c.games,percent:c.percent}}
function redeemModal(done){modal(`<form class="stack" id="rdf"><h3>${t('rd_title')}</h3><input type="text" id="rd-c" dir="ltr" maxlength="24" placeholder="PLAYO-XXXXX" autocomplete="off" style="text-transform:uppercase;font-family:monospace;font-size:20px;text-align:center"><p class="small" id="rd-x" style="color:var(--bad);min-height:18px"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-c>${t('cancel')}</button><button class="btn primary" type="submit">${t('rd_use')}</button></div></form>`,(m,close)=>{
  $('[data-c]',m).onclick=close;$('#rd-c',m).focus();
  $('#rdf',m).onsubmit=async e=>{e.preventDefault();const code=$('#rd-c',m).value.trim().toUpperCase();if(!code)return;const r=await redeem(code);
    if(!r.ok){$('#rd-x',m).textContent=t('rd_e_'+(r.err||'bad'));sfx('bad');return}
    close();sfx('win');confetti();toast(r.kind==='days'?t('rd_okDays',dN(r.days)):r.kind==='percent'?t('rd_okPct',r.percent):t('rd_okGames',(r.games||[]).map(g=>t('g_'+g)).join('، ')));done&&done()}})}

SCREENS.stats=function(){
  const P=profile,GS=P.gstats||{},H=P.history||[],now=Date.now(),DY=P.days||{};
  Object.entries(P.played||{}).forEach(([g,n])=>{if(!GS[g])GS[g]={n,w:0,pts:0,last:0}});   // matches played before per-game stats existed
  const days=[...Array(14)].map((_,i)=>{const d=new Date(now-(13-i)*864e5).toISOString().slice(0,10);return{d,n:DY[d]!=null?DY[d]:H.filter(h=>new Date(h.at).toISOString().slice(0,10)===d).length}});
  const mx=Math.max(1,...days.map(x=>x.n)),week=days.slice(7).reduce((a,x)=>a+x.n,0),prevW=days.slice(0,7).reduce((a,x)=>a+x.n,0);

   ${secs.length?`<div class="panel"><h3 style="margin-bottom:8px">${t('st_secs')}</h3><div class="stackbar">${secs.map(s=>`<i style="width:${s.n/tot*100}%;background:${TINT[s.x]}"></i>`).join('')}</div><div class="chips" style="margin-top:8px">${secs.map(s=>`<span class="chip"><span class="dot" style="background:${TINT[s.x]}"></span>${t('sec_'+s.x)} ${Math.round(s.n/tot*100)}%</span>`).join('')}</div></div>`:''}
   <div class="panel"><h3 style="margin-bottom:6px">${t('st_games')}</h3>${rows.length?`<div class="gtable"><div class="gt-h"><span>${t('games')}</span><span>${t('matches')}</span><span>${t('st_wins')}</span><span>${t('best')}</span></div>${rows.map(({g,s})=>`<div><span><b>${t('g_'+g.id)}</b><i class="small muted">${s.last?ago(s.last):''}</i></span><span class="tnum">${s.n}</span><span class="tnum">${s.w||'—'}</span><span class="tnum">${best(g)}</span></div>`).join('')}</div>`:`<p class="muted">${t('noHistory')}</p>`}</div>

  const bind=(id,fn)=>{$('#'+id).onclick=()=>{fn();store.set('settings',settings);SCREENS.settings()}};
  bind('s-sound',()=>{settings.sound=!settings.sound;if(settings.sound)sfx('good')});bind('s-music',()=>{settings.music=!settings.music;ac();musicSync()});bind('s-xt',()=>settings.extraTurn=!settings.extraTurn);
  ['friend','invite','rank','ach','online'].forEach(k=>bind('n-'+k,()=>settings.notif[k]=!settings.notif[k]));
  const info=(h,b)=>modal(`<h3 style="margin-bottom:10px">${h}</h3><p class="muted">${b}</p><button class="btn block" style="margin-top:14px" data-ok>${t('ok')}</button>`,(m,close)=>{$('[data-ok]',m).onclick=close});
  $('#pp').onclick=()=>info(t('privacy'),t('privacyTxt'));$('#tm').onclick=()=>info(t('terms'),t('termsTxt'));
  $('#rs').onclick=async()=>{if(await confirmBox(t('resetQ'),t('reset'))){try{['profile','social','notifs'].forEach(k=>localStorage.removeItem('zk_'+k))}catch(e){}profile=null;social=null;notifs=[];SCREENS.onboard();$('#ad').hidden=true;document.body.classList.remove('has-ad')}};
};

/* ========= boot ========= */
applyLang();
if(NATIVE){const A=PLUG('App');
  if(A){const onUrl=u=>{const m=/r\/([A-Za-z0-9]{6})/.exec(u||'')||/#r-([A-Za-z0-9]{6})/.exec(u||'');if(m){pendingJoin=m[1].toUpperCase();if(profile&&current!=='game')tryPendingJoin()}};
    A.addListener('appUrlOpen',e=>onUrl(e&&e.url));
    if(A.getLaunchUrl)A.getLaunchUrl().then(r=>r&&onUrl(r.url)).catch(()=>{});
    A.addListener('backButton',()=>{const mb=$('.modal-back');if(mb){mb.remove();return}
      if(current==='game'){const q=$('#gquit');if(q)q.click();return}
      if(current==='home'||!profile){A.exitApp();return}
      if(current==='lobby'&&NET.nr){NET.leave()}go('home')})}}
document.addEventListener('pointerdown',()=>{ac();if(settings.music&&!musicTimer)musicSync()},{once:true});
if(!profile){SCREENS.onboard()}else{if(!social){social=seedSocial();store.set('social',social)}
  if(!profile.flags)profile.flags={};
  const on=social.friends.find(f=>f.online);if(on&&rnd()<.5)pushNotif('online',t('n_online',on.u));
  if(location.hash==='#admin')go('admin');else go('home')}
addEventListener('hashchange',()=>{if(location.hash==='#admin'&&profile)go('admin')});
PAY.init().then(()=>ACC.init()).then(()=>{if(current==='home'||current==='settings')go(current,params)}).catch(()=>{});
})();
</script>
