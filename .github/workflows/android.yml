name: Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log
      - run: cp android/app/build/outputs/apk/release/app-release.apk playo.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rijo 1.0.${{ github.run_number }}
          make_latest: true
          files: playo.apk
          body: |
            حمّل playo.apk على هاتف أندرويد وافتحه للتثبيت.
            Download playo.apk on an Android phone and open it to install.
      - uses: actions/upload-artifact@v4
        with:
          name: playo-apk
          path: playo.apk
